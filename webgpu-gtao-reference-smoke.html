<!doctype html>
<meta charset="utf-8">
<title>GTAO reconstruction reference-policy regression</title>
<pre id="status">Running bounded software-WebGPU reference checks...</pre>
<script src="engine/webgpu_resources.js"></script>
<script src="engine/webgpu_gtao.js"></script>
<script src="tools/sm600_gtao_reference_fixtures.js"></script>
<script>
'use strict';
(async()=>{
  const G=SteelMothWebGPUGTAO,F=SteelMothGTAOReferenceFixtures;
  const report={schema:'steelmoth-gtao-reference-policy-browser/v1',ok:false,softwareRequested:true,benchmark:false,targetAcceptance:false,
    evidenceBoundary:'Reference-policy and finite-input resource correctness. No physical GPU timing, visible in-game defect or optimization adoption is claimed.',compilation:[],cases:[],uncapturedErrors:[]};
  globalThis.SM600ReferenceProgress=report;
  let device;
  const check=(v,m)=>{if(!v)throw new Error(m);},align=n=>Math.ceil(n/256)*256;
  const same=(a,b)=>a.length===b.length&&a.every((v,i)=>v===b[i]);
  async function sha(text){const a=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return Array.from(new Uint8Array(a),b=>b.toString(16).padStart(2,'0')).join('');}
  try{
    check(navigator.gpu,'WebGPU unavailable: this is a failure, not a skip.');
    const adapter=await navigator.gpu.requestAdapter({forceFallbackAdapter:true});check(adapter,'Software WebGPU adapter unavailable.');
    const info=adapter.info||{};
    report.adapter={vendor:info.vendor||'',architecture:info.architecture||'',description:info.description||'',isFallbackAdapter:!!(info.isFallbackAdapter??adapter.isFallbackAdapter)};
    check(report.adapter.isFallbackAdapter||/swiftshader|software/i.test(JSON.stringify(report.adapter)),'Software-adapter identity not established.');
    device=await adapter.requestDevice();device.addEventListener('uncapturederror',e=>report.uncapturedErrors.push(String(e.error?.message||e.error)));
    report.sourceHashes={raw:await sha(G.RAW_WGSL),upsample:await sha(G.UPSAMPLE_WGSL),lowerThresholdControl:await sha(F.lowerThresholdShader(G.UPSAMPLE_WGSL))};
    check(report.sourceHashes.raw===F.BASELINE_RAW_SHA256&&report.sourceHashes.upsample===F.BASELINE_UP_SHA256,'Production WGSL changed; this must remain a reference-only repair.');
    const tex=binding=>({binding,visibility:GPUShaderStage.COMPUTE,texture:{sampleType:'unfilterable-float'}});
    const layout=device.createBindGroupLayout({entries:[tex(0),tex(1),tex(2),{binding:3,visibility:GPUShaderStage.COMPUTE,buffer:{type:'uniform',minBindingSize:64}},...[4,5].map(binding=>({binding,visibility:GPUShaderStage.COMPUTE,storageTexture:{access:'write-only',format:'r32float'}}))]});
    async function pipeline(code,label,bindLayout){
      device.pushErrorScope('validation');const module=device.createShaderModule({code,label}),ci=await module.getCompilationInfo();
      report.compilation.push({label,messages:ci.messages.map(x=>({type:x.type,message:x.message,lineNum:x.lineNum}))});
      check(!ci.messages.some(x=>x.type==='error'),`${label} compilation failed.`);
      const p=await device.createComputePipelineAsync({label,layout:bindLayout?device.createPipelineLayout({bindGroupLayouts:[bindLayout]}):'auto',compute:{module,entryPoint:'cs_main'}});
      const error=await device.popErrorScope();check(!error,`${label}: ${error?.message}`);return p;
    }
    const kernels=[{name:'production',threshold:F.f32FromBits(F.POLICY_BITS),pipeline:await pipeline(G.UPSAMPLE_WGSL,'unchanged-production-upsample',layout)},
      {name:'lower-threshold-control',threshold:Math.fround(1e-8),pipeline:await pipeline(F.lowerThresholdShader(G.UPSAMPLE_WGSL),'test-only-1e-8-upsample',layout)}];
    // Test the exact production conditional with externally supplied f32 sums.
    // This separates equality/one-ULP branch policy from normalize/pow accuracy.
    const guard=G.UPSAMPLE_WGSL.match(/if\((ws>[^)]+)\)/);check(guard,'Production guard not found.');
    const scalarCode=`@group(0) @binding(0) var<storage,read> sums:array<f32>;\n@group(0) @binding(1) var<storage,read_write> results:array<u32>;\n@compute @workgroup_size(1) fn cs_main(@builtin(global_invocation_id) id:vec3u){let ws=sums[id.x];results[id.x]=select(0u,1u,${guard[1]});}`;
    const scalar=await pipeline(scalarCode,'exact-f32-branch-policy'),weights=F.boundaryWeights();
    const input=device.createBuffer({size:weights.byteLength,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST}),output=device.createBuffer({size:weights.byteLength,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC}),read=device.createBuffer({size:weights.byteLength,usage:GPUBufferUsage.MAP_READ|GPUBufferUsage.COPY_DST});
    try{
      device.queue.writeBuffer(input,0,weights);const bg=device.createBindGroup({layout:scalar.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:input}},{binding:1,resource:{buffer:output}}]}),encoder=device.createCommandEncoder(),pass=encoder.beginComputePass();
      pass.setPipeline(scalar);pass.setBindGroup(0,bg);pass.dispatchWorkgroups(weights.length);pass.end();encoder.copyBufferToBuffer(output,0,read,0,weights.byteLength);device.queue.submit([encoder.finish()]);
      await read.mapAsync(GPUMapMode.READ);const flags=Array.from(new Uint32Array(read.getMappedRange().slice(0)));read.unmap();
      report.boundary=Array.from(weights,(weight,i)=>{const expected=weight>F.f32FromBits(F.POLICY_BITS);check(flags[i]===Number(expected)&&G.upsampleHasSupport(weight)===expected,`Exact f32 predicate mismatch at ${weight}`);return {weight,gpuSupported:!!flags[i],referenceSupported:expected};});
    }finally{input.destroy();output.destroy();read.destroy();}
    let maxReferenceError=0,exactBranchChecks=0,policyDifferencePixels=0;
    for(const f of F.cases()){
      report.phase=f.name;device.pushErrorScope('validation');const owned=[];
      const texture=(w,h,format,usage)=>{const t=device.createTexture({size:[w,h],format,usage});owned.push(t);return t;};
      const {width:w,height:h,raw}=f;
      const depth=texture(w,h,'rg32float',GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST),normal=texture(w,h,'rgba16float',GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST),rawTex=texture(raw.width,raw.height,'rgba16float',GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST);
      device.queue.writeTexture({texture:depth},f.depth,{bytesPerRow:w*8},[w,h]);device.queue.writeTexture({texture:normal},Uint16Array.from(f.normal,F.halfBits),{bytesPerRow:w*8},[w,h]);device.queue.writeTexture({texture:rawTex},Uint16Array.from(raw.data,F.halfBits),{bytesPerRow:raw.width*8},[raw.width,raw.height]);
      const params=device.createBuffer({size:64,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});owned.push(params);
      const variants=kernels.map(k=>{const outputs=[0,1].map(()=>texture(w,h,'r32float',GPUTextureUsage.STORAGE_BINDING|GPUTextureUsage.COPY_SRC));const bind=device.createBindGroup({layout,entries:[{binding:0,resource:rawTex.createView()},{binding:1,resource:depth.createView()},{binding:2,resource:normal.createView()},{binding:3,resource:{buffer:params}},...outputs.map((t,i)=>({binding:4+i,resource:t.createView()}))]});return {...k,outputs,bind};});
      const pitch=align(w*4),capture=device.createBuffer({size:pitch*h*2,usage:GPUBufferUsage.MAP_READ|GPUBufferUsage.COPY_DST});owned.push(capture);
      async function readOutputs(v){const encoder=device.createCommandEncoder();for(let i=0;i<2;i++)encoder.copyTextureToBuffer({texture:v.outputs[i]},{buffer:capture,offset:i*pitch*h,bytesPerRow:pitch},[w,h]);device.queue.submit([encoder.finish()]);await capture.mapAsync(GPUMapMode.READ);const mapped=new Uint8Array(capture.getMappedRange()),planes=[0,1].map(i=>{const a=new Uint8Array(w*h*4);for(let y=0;y<h;y++)a.set(mapped.subarray(i*pitch*h+y*pitch,i*pitch*h+y*pitch+w*4),y*w*4);return a;});capture.unmap();return planes;}
      try{
        let caseError=0;const witness={};
        for(const debugMode of G.DEBUG_MODES){
          const options=G.normalizeOptions({...f.options,debugMode}),input={...f,options};device.queue.writeBuffer(params,0,G.parameterBytes(w,h,options));
          const expectedCPU=G.referenceUpsample(raw,f.depth,f.normal,w,h,options),previous=[];
          for(let repeat=0;repeat<2;repeat++){
            const encoder=device.createCommandEncoder();for(const v of variants){const p=encoder.beginComputePass();p.setPipeline(v.pipeline);p.setBindGroup(0,v.bind);p.dispatchWorkgroups(Math.ceil(w/8),Math.ceil(h/8));p.end();}device.queue.submit([encoder.finish()]);
            for(let j=0;j<variants.length;j++){
              const v=variants[j],planes=await readOutputs(v);if(repeat)for(let plane=0;plane<2;plane++)check(same(previous[j][plane],planes[plane]),`${f.name} ${v.name} unstable reused output.`);else previous[j]=planes;
              const vis=new Float32Array(planes[0].buffer),dbg=new Float32Array(planes[1].buffer);
              for(let i=0;i<w*h;i++){
                const expected=F.oracleAt(input,i%w,Math.floor(i/w),v.threshold),referenceVis=j===0?expectedCPU.visibility[i]:Math.fround(expected.visibility),referenceConf=j===0?expectedCPU.confidence[i]:Math.fround(expected.confidence);
                const expectedDebug=debugMode==='occlusion'?Math.fround(1-referenceVis):debugMode==='raw-half'?Math.fround(expected.nearest):debugMode==='upsample-confidence'?referenceConf:referenceVis;
                check(Number.isFinite(vis[i])&&Number.isFinite(dbg[i])&&vis[i]>=0&&vis[i]<=1,`${f.name} invalid output.`);
                const error=Math.max(Math.abs(vis[i]-referenceVis),Math.abs(dbg[i]-expectedDebug));caseError=Math.max(caseError,error);check(error<=2e-6,`${f.name} ${v.name} ${debugMode} pixel ${i}: arithmetic mismatch ${error}`);
                if(debugMode==='upsample-confidence'&&!expected.neutral){check((dbg[i]===0)===!expected.supported,`${f.name} ${v.name} exact fallback branch differs.`);if(!expected.supported)check(vis[i]===expected.nearest,`${f.name} fallback must be exact nearest raw.`);exactBranchChecks++;}
              }
              if(debugMode==='upsample-confidence'&&f.name==='original-4x4-witness')witness[v.name]={visibility:vis[0],confidence:dbg[0]};
            }
            if(debugMode==='upsample-confidence'&&repeat===0){const a=new Float32Array(previous[0][0].buffer),b=new Float32Array(previous[1][0].buffer);for(let i=0;i<a.length;i++)if(a[i]!==b[i])policyDifferencePixels++;}
          }
        }
        if(f.name==='original-4x4-witness'){check(witness.production.visibility===.25&&witness.production.confidence===0,'Production weak-weight fallback regressed.');check(Math.abs(witness['lower-threshold-control'].visibility-.5591996312141418)<2e-6,'Lower-threshold policy was not exercised.');report.witness=witness;}
        maxReferenceError=Math.max(maxReferenceError,caseError);report.cases.push({name:f.name,width:w,height:h,debugModes:4,repeats:2,policies:2,outputsStableOnReuse:true,maxReferenceError:caseError});
        const error=await device.popErrorScope();check(!error,`${f.name}: ${error?.message}`);
      }finally{owned.reverse().forEach(x=>x.destroy());}
    }
    await device.queue.onSubmittedWorkDone();check(!report.uncapturedErrors.length,'Uncaptured WebGPU errors.');check(policyDifferencePixels>0,'No weak-weight policy difference was tested.');
    Object.assign(report,{maxReferenceError,exactBranchChecks,policyDifferencePixels,fixtureConfigurations:report.cases.length*4,ok:true});
  }catch(e){report.error=String(e.stack||e);}
  finally{device?.destroy();globalThis.SM600ReferenceResult=report;document.getElementById('status').textContent=JSON.stringify(report,null,2);}
})();
</script>
