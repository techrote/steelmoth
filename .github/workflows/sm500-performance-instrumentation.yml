name: SM-500 WebGPU performance instrumentation

on:
  pull_request:
    paths:
      - 'engine/webgpu_performance.js'
      - 'engine/webgpu_resources.js'
      - 'engine/webgpu_device.js'
      - 'webgpu-resources-smoke.html'
      - 'tools/validate_webgpu_performance.js'
      - 'tools/validate_webgpu_resources.js'
      - 'tools/validate_webgpu_resources_browser.py'
      - 'tools/validate_webgpu_resources_contract.py'
      - 'docs/WEBGPU_PERFORMANCE_INSTRUMENTATION_SM500.md'
      - '.github/workflows/sm500-performance-instrumentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumentation:
    name: deterministic + real-browser timing instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser validation dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
      - name: Validate deterministic SM-500 timing paths
        run: |
          node --check engine/webgpu_performance.js
          node tools/validate_webgpu_performance.js
          python tools/validate_webgpu_resources_contract.py
      - name: Verify Chrome/Chromium availability
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; \
          elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; \
          elif command -v chromium >/dev/null 2>&1; then chromium --version; \
          else echo 'Chrome/Chromium required for SM-500 browser instrumentation validation' >&2; exit 1; fi
      - name: Exercise real WebGPU frame-graph timing and unavailable-feature contract
        run: python tools/validate_webgpu_resources_browser.py --report artifacts/sm500-performance-browser.json
      - name: Upload SM-500 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm500-performance-instrumentation-${{ github.run_id }}
          path: artifacts/sm500-performance-browser.json
          if-no-files-found: warn
