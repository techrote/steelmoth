name: SM-303 WebGPU DSO hard core

on:
  pull_request:
    paths:
      - 'engine/webgpu_dso.js'
      - 'engine/webgpu_dominance.js'
      - 'engine/webgpu_clusters.js'
      - 'engine/webgpu_occluders.js'
      - 'webgpu-dso-smoke.html'
      - 'tools/validate_webgpu_dso*'
      - 'tools/run_checks.py'
      - 'tools/validate_clean_package.py'
      - 'docs/WEBGPU_DSO_SM303.md'
      - 'docs/WEBGPU_ARCHITECTURE.md'
      - 'webapp.js'
      - 'sw.js'
      - '.github/workflows/sm303-dso.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sm303-dso-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dso:
    name: eight-angle hard mask + structural metrics + GPU readback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser validation dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
      - name: Validate deterministic hard core, structural metrics and contract
        run: |
          node --check engine/webgpu_dso.js
          node tools/validate_webgpu_dso.js
          python tools/validate_webgpu_dso_contract.py
      - name: Verify Chrome/Chromium availability
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; \
          elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; \
          elif command -v chromium >/dev/null 2>&1; then chromium --version; \
          else echo 'Chrome/Chromium required for SM-303 WebGPU validation' >&2; exit 1; fi
      - name: Validate tile-local DSO WGSL, exact mask readback and box/bin captures
        run: python tools/validate_webgpu_dso_browser.py --require-webgpu --report artifacts/webgpu-dso-browser.json
      - name: Upload SM-303 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm303-webgpu-dso-${{ github.run_id }}
          path: |
            artifacts/webgpu-dso-browser.json
            artifacts/webgpu-dso-browser.png
          if-no-files-found: warn
