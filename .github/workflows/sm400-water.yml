name: SM-400 WebGPU canonical water

on:
  pull_request:
    paths:
      - 'engine/webgpu_water.js'
      - 'engine/webgpu_lighting.js'
      - 'engine/webgpu_gbuffer.js'
      - 'engine/webgpu_visibility.js'
      - 'engine/webgpu_resources.js'
      - 'webgpu-water-smoke.html'
      - 'tools/validate_webgpu_water*'
      - 'tools/run_checks.py'
      - 'docs/WEBGPU_WATER_SM400.md'
      - 'webapp.js'
      - 'sw.js'
      - '.github/workflows/sm400-water.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sm400-water-${{ github.ref }}
  cancel-in-progress: true
jobs:
  water:
    name: canonical light + depth + visibility + room/ripple readback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser validation dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
      - name: Validate deterministic water model and contracts
        run: |
          node --check engine/webgpu_water.js
          node --check tools/validate_webgpu_water.js
          node tools/validate_webgpu_water.js
          python tools/validate_webgpu_water_contract.py
      - name: Verify Chrome/Chromium availability
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; \
          elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; \
          elif command -v chromium >/dev/null 2>&1; then chromium --version; \
          else echo 'Chrome/Chromium required for SM-400 WebGPU validation' >&2; exit 1; fi
      - name: Validate canonical WebGPU water execution and readback
        run: python tools/validate_webgpu_water_browser.py --require-webgpu --report artifacts/webgpu-water-browser.json
      - name: Upload SM-400 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm400-webgpu-water-${{ github.run_id }}
          path: |
            artifacts/webgpu-water-browser.json
            artifacts/webgpu-water-browser.png
          if-no-files-found: warn
