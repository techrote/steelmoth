name: SM-801 static submission study

on:
  pull_request:
    paths:
      - 'tools/sm801_static_submission_probe.js'
      - 'tools/validate_webgpu_static_submission.js'
      - 'tools/validate_webgpu_static_submission_browser.py'
      - 'tools/validate_webgpu_static_submission_contract.py'
      - 'webgpu-static-submission-smoke.html'
      - 'docs/WEBGPU_STATIC_SUBMISSION_SM801.md'
      - '.github/workflows/sm801-static-submission.yml'
  workflow_dispatch:

jobs:
  static-submission-study:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser harness
        run: |
          python -m pip install -r tools/requirements-ci.txt
          python -m pip install "selenium>=4.25,<5"
      - name: Deterministic model and source contract
        run: |
          node --check tools/sm801_static_submission_probe.js
          node --check tools/validate_webgpu_static_submission.js
          node tools/validate_webgpu_static_submission.js
          python -m py_compile tools/validate_webgpu_static_submission_browser.py tools/validate_webgpu_static_submission_contract.py
          python tools/validate_webgpu_static_submission_contract.py
      - name: Run Chrome and Firefox render-bundle A/B
        env:
          MOZ_WEBRENDER: '1'
        run: python tools/validate_webgpu_static_submission_browser.py --timeout 180 --report artifacts/sm801/static-submission-report.json
      - name: Upload SM-801 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm801-static-submission-evidence
          path: artifacts/sm801/
          if-no-files-found: warn
