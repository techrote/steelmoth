name: SM-405 Windows cross-browser functional parity

on:
  pull_request:
    paths:
      - 'webgpu-cross-browser-smoke.html'
      - 'tools/validate_webgpu_cross_browser.py'
      - 'tools/validate_webgpu_cross_browser_contract.py'
      - 'docs/WEBGPU_FUNCTIONAL_PARITY_VALIDATION.md'
      - 'engine/webgpu_*.js'
      - 'engine/backend_runtime.js'
      - 'webgpu-*-smoke.html'
      - '.github/workflows/sm405-functional-parity.yml'
  workflow_dispatch:

jobs:
  windows-cross-browser:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser harness
        run: python -m pip install "selenium>=4.25,<5"
      - name: Validate SM-405 contract
        run: |
          python -m py_compile tools/validate_webgpu_cross_browser.py tools/validate_webgpu_cross_browser_contract.py
          python tools/validate_webgpu_cross_browser_contract.py
      - name: Record installed browser versions
        shell: pwsh
        run: |
          $chrome = @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          $firefox = @("$env:ProgramFiles\Mozilla Firefox\firefox.exe", "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($chrome) { & $chrome --version } else { Write-Error "Chrome not installed" }
          if ($firefox) { & $firefox --version } else { Write-Error "Firefox not installed" }
      - name: Run Chrome and Firefox WebGPU functional matrix
        env:
          MOZ_WEBRENDER: '1'
        run: python tools/validate_webgpu_cross_browser.py --browsers chrome firefox --timeout 90 --report artifacts/sm405/cross-browser-functional.json
      - name: Upload SM-405 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm405-windows-cross-browser-functional
          path: artifacts/sm405/
          if-no-files-found: warn
