name: SM-301 WebGPU stable clusters

on:
  pull_request:
    paths:
      - 'engine/webgpu_clusters.js'
      - 'engine/webgpu_occluders.js'
      - 'webgpu-clusters-smoke.html'
      - 'tools/validate_webgpu_clusters*'
      - 'tools/run_checks.py'
      - 'tools/validate_clean_package.py'
      - 'docs/WEBGPU_CLUSTERS_SM301.md'
      - 'webapp.js'
      - 'sw.js'
      - '.github/workflows/sm301-clusters.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sm301-clusters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clusters:
    name: stable geometry clustering + GPU readback + perturbation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser validation dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
      - name: Validate source, deterministic membership, perturbations and contract
        run: |
          node --check engine/webgpu_clusters.js
          node tools/validate_webgpu_clusters.js
          python tools/validate_webgpu_clusters_contract.py
      - name: Verify Chrome/Chromium availability
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; \
          elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; \
          elif command -v chromium >/dev/null 2>&1; then chromium --version; \
          else echo 'Chrome/Chromium required for SM-301 WebGPU validation' >&2; exit 1; fi
      - name: Validate cluster/member buffers, bounded candidates, readback and invalidation
        run: python tools/validate_webgpu_clusters_browser.py --require-webgpu --report artifacts/webgpu-clusters-browser.json
      - name: Upload SM-301 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm301-webgpu-clusters-${{ github.run_id }}
          path: artifacts/webgpu-clusters-browser.json
          if-no-files-found: warn
