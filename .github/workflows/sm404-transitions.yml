name: SM-404 WebGPU room transition invalidation

on:
  pull_request:
    paths:
      - 'engine/webgpu_transition_state.js'
      - 'engine/webgpu_resources.js'
      - 'engine/webgpu_depth_hierarchy.js'
      - 'engine/backend_runtime.js'
      - 'engine/game.js'
      - 'tools/validate_webgpu_transition.js'
      - 'tools/validate_webgpu_transition_contract.py'
      - 'webgpu-transition-smoke.html'
      - 'docs/WEBGPU_TRANSITIONS_SM404.md'
      - 'game_data/maps.json'
      - 'webapp.js'
      - 'sw.js'
      - '.github/workflows/sm404-transitions.yml'
  workflow_dispatch:

jobs:
  transition-invalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser harness dependency
        run: python -m pip install websocket-client>=1.8
      - name: Syntax and deterministic transition regression
        run: |
          node --check engine/webgpu_transition_state.js
          node --check tools/validate_webgpu_transition.js
          node tools/validate_webgpu_transition.js
          python tools/validate_webgpu_transition_contract.py
      - name: Verify Chrome WebGPU runtime
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          google-chrome --version || google-chrome-stable --version || chromium --version
      - name: Real-WebGPU room transition and resize smoke
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import base64,json,os,signal,subprocess,tempfile,threading,time
          from pathlib import Path
          from tools.validate_webgpu_ordering_browser import Quiet,Server,CDP,browser,free_port,json_get
          root=Path.cwd();exe=browser()
          if not exe:raise SystemExit('SM-404 browser FAIL: Chrome/Chromium not found')
          handler=lambda *a,**k:Quiet(*a,directory=str(root),**k)
          srv=Server(('127.0.0.1',0),handler);threading.Thread(target=srv.serve_forever,daemon=True).start();port=srv.server_address[1]
          proc=None;cdp=None
          try:
            with tempfile.TemporaryDirectory(prefix='steelmoth-sm404-chrome-') as profile:
              debug=free_port();url=f'http://127.0.0.1:{port}/webgpu-transition-smoke.html'
              cmd=[exe,'--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-background-networking','--disable-component-update','--disable-default-apps','--disable-sync','--metrics-recording-only','--no-first-run','--enable-webgl','--enable-unsafe-webgpu','--remote-allow-origins=*',f'--remote-debugging-port={debug}',f'--user-data-dir={profile}',url]
              proc=subprocess.Popen(cmd,cwd=root,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,text=True,start_new_session=True);deadline=time.monotonic()+120;target=None
              while time.monotonic()<deadline and proc.poll() is None:
                try:
                  target=next((t for t in json_get(f'http://127.0.0.1:{debug}/json/list') if t.get('type')=='page' and 'webgpu-transition-smoke.html' in t.get('url','')),None)
                  if target:break
                except Exception:pass
                time.sleep(.15)
              if not target:raise RuntimeError('Chrome DevTools SM-404 target unavailable')
              cdp=CDP(target['webSocketDebuggerUrl'],timeout=100);cdp.call('Runtime.enable');cdp.call('Page.enable')
              while time.monotonic()<deadline:
                if cdp.eval("document.body && document.body.dataset.webgpuTransitionDone==='1'"):break
                time.sleep(.2)
              else:raise RuntimeError('SM-404 transition page did not publish before timeout')
              text=cdp.eval("document.getElementById('webgpuTransitionResult')?.textContent || ''");report=json.loads(text)
              if not report.get('ok'):raise RuntimeError('SM-404 browser FAIL: '+str(report.get('error') or [c for c in report.get('checks',[]) if not c.get('ok')][:3]))
              checks=report.get('checks') or []
              if len(checks)<28:raise RuntimeError(f'SM-404 browser FAIL: only {len(checks)} assertions')
              if not (report.get('readback') or {}).get('realWebGPU'):raise RuntimeError('SM-404 browser FAIL: real WebGPU evidence missing')
              ids={c.get('id'):c for c in checks}
              for required in ['surface-texture-rebuilt','static-buffer-preserved','resize-cluster-preserved','resize-object-rejected','backend-stale-cluster-rejected','device-loss-event']:
                if not ids.get(required,{}).get('ok'):raise RuntimeError(f'SM-404 browser FAIL: required assertion {required}')
              diag=report.get('diagnostics') or {}
              if (diag.get('contract') or {}).get('blanketReset') is not False:raise RuntimeError('SM-404 browser FAIL: blanket reset contract missing')
              Path('artifacts/webgpu-transition-browser.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8')
              png=cdp.call('Page.captureScreenshot',{'format':'png','fromSurface':True}).get('data','')
              if not png:raise RuntimeError('SM-404 screenshot returned no data')
              Path('artifacts/webgpu-transition-browser.png').write_bytes(base64.b64decode(png));Path('artifacts/webgpu-transition-dom.html').write_text(cdp.eval('document.documentElement.outerHTML'),encoding='utf-8')
              print(f"SM-404 WEBGPU TRANSITION PASS: {len(checks)} assertions, revision={diag.get('revision')}, events={len(diag.get('events') or [])}")
          finally:
            if cdp:cdp.close()
            if proc and proc.poll() is None:
              try:os.killpg(proc.pid,signal.SIGTERM);proc.wait(timeout=4)
              except Exception:
                try:os.killpg(proc.pid,signal.SIGKILL)
                except Exception:pass
            if proc and proc.stderr:
              try:Path('artifacts/sm404-chrome.log').write_text(proc.stderr.read()[-12000:],encoding='utf-8')
              except Exception:pass
            srv.shutdown();srv.server_close()
          PY
      - name: Upload SM-404 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm404-webgpu-transition-evidence
          path: |
            artifacts/webgpu-transition-browser.json
            artifacts/webgpu-transition-browser.png
            artifacts/webgpu-transition-dom.html
            artifacts/sm404-chrome.log
          if-no-files-found: warn
