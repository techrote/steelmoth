name: SM-502 apply source transformation

on:
  push:
    branches: [sm502-colour-pipeline]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sm502-colour-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair bootstrap anchor and apply SM-502 source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_sm502_patch.py')
          s=p.read_text(encoding='utf-8')
          old='SCHEMA,DEFAULTS,normalizeSettings,bloomPassesForQuality,applyPostReference,packPostSettings'
          new='SCHEMA,DEFAULTS,BRIGHT_WGSL,BLUR_WGSL,POST_WGSL,RAW_WGSL,normalizeSettings,bloomPassesForQuality,applyPostReference,packPostSettings'
          if old not in s:
              raise SystemExit('post export bootstrap anchor not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          python tools/apply_sm502_patch.py
      - name: Commit transformed source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "SM-502: correct WebGPU linear sRGB HDR pipeline"
          git push origin HEAD:sm502-colour-pipeline
