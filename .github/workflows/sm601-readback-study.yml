name: SM-601 readback scheduling (software correctness)

on:
  pull_request:
    paths:
      - 'engine/webgpu_gtao_readback.js'
      - 'engine/webgpu_gtao_stabilization.js'
      - 'engine/webgpu_gtao.js'
      - 'engine/webgpu_resources.js'
      - 'tools/validate_sm601_gtao_readback.js'
      - 'tools/run_sm601_gtao_readback_study.py'
      - 'sm601-gtao-readback-study.html'
      - '.github/workflows/sm601-readback-study.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sm601-readback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing browser-driver dependency
        run: python -m pip install --disable-pip-version-check 'websocket-client>=1.8'
      - name: CPU ordering, lifecycle, boundedness and inherited reference tests
        run: |
          node --check engine/webgpu_gtao_readback.js
          node tools/validate_webgpu_gtao_stabilization.js
          node tools/validate_sm601_gtao_readback.js --report artifacts/sm601-readback-cpu.json
          python -m py_compile tools/run_sm601_gtao_readback_study.py
      - name: Baseline/deferred real WGSL and buffer-lifecycle parity on software WebGPU
        run: python tools/run_sm601_gtao_readback_study.py --report artifacts/sm601-readback-browser.json
      - name: Retain exact-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm601-readback-${{ github.run_id }}
          path: artifacts/sm601-readback-*.json
          if-no-files-found: error
