name: SM-502 repair post browser validator

on:
  push:
    branches: [sm502-colour-pipeline]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sm502-colour-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Migrate inherited browser validator
        run: python tools/repair_sm502_post_browser_validator.py
      - name: Commit source-only repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/validate_webgpu_post_browser.py
          git diff --cached --check
          git commit -m "SM-502: migrate post browser colour contract"
          git push origin HEAD:sm502-colour-pipeline
