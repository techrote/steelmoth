name: SM-402 WebGPU transparent/procedural ordering

on:
  pull_request:
    paths:
      - 'engine/webgpu_ordering.js'
      - 'engine/webgpu_transparent_fx.js'
      - 'engine/webgpu_post.js'
      - 'engine/webgpu_water.js'
      - 'engine/webgpu_foliage.js'
      - 'webgpu-ordering-smoke.html'
      - 'tools/validate_webgpu_ordering*'
      - 'docs/WEBGPU_ORDERING_SM402.md'
      - 'webapp.js'
      - 'sw.js'
      - '.github/workflows/sm402-ordering.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sm402-ordering-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ordering:
    name: canonical stage order + depth/classifier + raw/debug readback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser validation dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
      - name: Validate deterministic ordering model and contracts
        run: |
          node --check engine/webgpu_ordering.js
          node --check tools/validate_webgpu_ordering.js
          node tools/validate_webgpu_ordering.js
          python tools/validate_webgpu_ordering_contract.py
      - name: Verify Chrome/Chromium availability
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; \
          elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; \
          elif command -v chromium >/dev/null 2>&1; then chromium --version; \
          else echo 'Chrome/Chromium required for SM-402 WebGPU validation' >&2; exit 1; fi
      - name: Validate canonical WebGPU ordering execution and readback
        run: python tools/validate_webgpu_ordering_browser.py --require-webgpu --report artifacts/webgpu-ordering-browser.json
      - name: Upload SM-402 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm402-webgpu-ordering-${{ github.run_id }}
          path: |
            artifacts/webgpu-ordering-browser.json
            artifacts/webgpu-ordering-browser.png
          if-no-files-found: warn
