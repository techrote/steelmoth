name: Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: source + deterministic regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
      - name: Run source and regression checks
        run: python tools/run_checks.py --group source --group regression --report artifacts/core-checks.json
      - name: Verify actionable failure reporting contract
        if: always()
        run: python tools/run_checks.py --self-test-failure --report artifacts/failure-probe.json
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-verification-${{ github.run_id }}
          path: artifacts/*.json
          if-no-files-found: warn

  webgpu-api-smoke:
    name: WebGPU lifecycle browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Chrome/Chromium availability
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; \
          elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; \
          elif command -v chromium >/dev/null 2>&1; then chromium --version; \
          else echo 'Chrome/Chromium required for SM-102 browser API smoke' >&2; exit 1; fi
      - name: Exercise staged Auto policy, browser capability detection and deliberate fallback
        run: python tools/validate_webgpu_browser.py --report artifacts/webgpu-browser-smoke.json
      - name: Upload WebGPU lifecycle browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-browser-smoke-${{ github.run_id }}
          path: artifacts/webgpu-browser-smoke.json
          if-no-files-found: warn

  webgl2-transform-parity:
    name: WebGL2 root-transform browser pixel parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - name: Install browser-capture dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
      - name: Verify Chrome/Chromium availability
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; \
          elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; \
          elif command -v chromium >/dev/null 2>&1; then chromium --version; \
          else echo 'Chrome/Chromium required for SM-101 pixel parity' >&2; exit 1; fi
      - name: Compare pre-SM-101 and shared-transform WebGL2 captures
        run: python tools/validate_render_transform_browser.py --report artifacts/render-transform-browser.json --out artifacts/render-transform-browser
      - name: Upload before-after browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-transform-browser-${{ github.run_id }}
          path: |
            artifacts/render-transform-browser.json
            artifacts/render-transform-browser/**
          if-no-files-found: warn

  glsl-software:
    name: GLSL + MRT software validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Mesa runtime
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri
      - name: Compile/link production GLSL and validate MRT variants
        run: python tools/run_checks.py --group glsl --report artifacts/glsl-checks.json
      - name: Upload GLSL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glsl-verification-${{ github.run_id }}
          path: artifacts/glsl-checks.json
          if-no-files-found: warn

  clean-package:
    name: clean source package + extraction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
      - name: Build, extract, and validate clean source package
        run: python tools/validate_clean_package.py --report artifacts/clean-package.json
      - name: Upload package validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-verification-${{ github.run_id }}
          path: artifacts/clean-package.json
          if-no-files-found: warn

# SM-102 adds real browser/API lifecycle smoke plus deterministic fake-device tests.
# Hosted success remains API/fallback correctness evidence only, not target-GPU
# performance or Chrome/Firefox target-machine compatibility. SM-104 will extend
# this surface with real production WGSL/resource/pipeline validation.
