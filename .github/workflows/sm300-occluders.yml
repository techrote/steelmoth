name: SM-300 WebGPU occluders

on:
  pull_request:
    paths:
      - 'engine/webgpu_occluders.js'
      - 'webgpu-occluders-smoke.html'
      - 'tools/validate_webgpu_occluders*'
      - 'docs/WEBGPU_OCCLUDERS_SM300.md'
      - 'webapp.js'
      - 'sw.js'
      - '.github/workflows/sm300-occluders.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sm300-occluders-${{ github.ref }}
  cancel-in-progress: true

jobs:
  occluders:
    name: bounded GPU occluders + tile relevance + invalidation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser validation dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
      - name: Validate source, deterministic packing and contract
        run: |
          node --check engine/webgpu_occluders.js
          node tools/validate_webgpu_occluders.js
          python tools/validate_webgpu_occluders_contract.py
      - name: Verify Chrome/Chromium availability
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; \
          elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; \
          elif command -v chromium >/dev/null 2>&1; then chromium --version; \
          else echo 'Chrome/Chromium required for SM-300 WebGPU validation' >&2; exit 1; fi
      - name: Validate persistent buffers, bounded tile bins, GPU readback and invalidation
        run: python tools/validate_webgpu_occluders_browser.py --require-webgpu --report artifacts/webgpu-occluders-browser.json
      - name: Upload SM-300 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm300-webgpu-occluders-${{ github.run_id }}
          path: artifacts/webgpu-occluders-browser.json
          if-no-files-found: warn
