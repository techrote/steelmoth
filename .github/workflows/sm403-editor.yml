name: SM-403 WebGPU editor integration

on:
  pull_request:
    paths:
      - 'engine/webgpu_editor_state.js'
      - 'engine/editor.js'
      - 'engine/webgl2_scene_adapter.js'
      - 'engine/webgpu_depth_hierarchy.js'
      - 'tools/validate_webgpu_editor.js'
      - 'tools/validate_webgpu_editor_contract.py'
      - 'webgpu-editor-smoke.html'
      - 'docs/WEBGPU_EDITOR_SM403.md'
      - 'webapp.js'
      - 'sw.js'
      - '.github/workflows/sm403-editor.yml'
  workflow_dispatch:

jobs:
  editor-invalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser harness dependency
        run: python -m pip install websocket-client>=1.8
      - name: Syntax and deterministic editor regression
        run: |
          node --check engine/webgpu_editor_state.js
          node --check tools/validate_webgpu_editor.js
          node tools/validate_webgpu_editor.js
          python tools/validate_webgpu_editor_contract.py
      - name: Verify Chrome WebGPU runtime
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          google-chrome --version || google-chrome-stable --version || chromium --version
      - name: Real-WebGPU editor invalidation smoke
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import base64,json,os,signal,subprocess,tempfile,threading,time
          from pathlib import Path
          from tools.validate_webgpu_ordering_browser import Quiet,Server,CDP,browser,free_port,json_get
          root=Path.cwd();exe=browser()
          if not exe:raise SystemExit('SM-403 browser FAIL: Chrome/Chromium not found')
          handler=lambda *a,**k:Quiet(*a,directory=str(root),**k)
          srv=Server(('127.0.0.1',0),handler);threading.Thread(target=srv.serve_forever,daemon=True).start();port=srv.server_address[1]
          proc=None;cdp=None
          try:
            with tempfile.TemporaryDirectory(prefix='steelmoth-sm403-chrome-') as profile:
              debug=free_port();url=f'http://127.0.0.1:{port}/webgpu-editor-smoke.html'
              cmd=[exe,'--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-background-networking','--disable-component-update','--disable-default-apps','--disable-sync','--metrics-recording-only','--no-first-run','--enable-webgl','--enable-unsafe-webgpu','--remote-allow-origins=*',f'--remote-debugging-port={debug}',f'--user-data-dir={profile}',url]
              proc=subprocess.Popen(cmd,cwd=root,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,text=True,start_new_session=True);deadline=time.monotonic()+120;target=None
              while time.monotonic()<deadline and proc.poll() is None:
                try:
                  target=next((t for t in json_get(f'http://127.0.0.1:{debug}/json/list') if t.get('type')=='page' and 'webgpu-editor-smoke.html' in t.get('url','')),None)
                  if target:break
                except Exception:pass
                time.sleep(.15)
              if not target:raise RuntimeError('Chrome DevTools SM-403 target unavailable')
              cdp=CDP(target['webSocketDebuggerUrl'],timeout=100);cdp.call('Runtime.enable');cdp.call('Page.enable')
              while time.monotonic()<deadline:
                if cdp.eval("document.body && document.body.dataset.webgpuEditorDone==='1'"):break
                time.sleep(.2)
              else:raise RuntimeError('SM-403 editor page did not publish before timeout')
              text=cdp.eval("document.getElementById('webgpuEditorResult')?.textContent || ''")
              report=json.loads(text)
              if not report.get('ok'):raise RuntimeError('SM-403 browser FAIL: '+str(report.get('error') or [c for c in report.get('checks',[]) if not c.get('ok')][:2]))
              checks=report.get('checks') or []
              if len(checks)<24:raise RuntimeError(f'SM-403 browser FAIL: only {len(checks)} assertions')
              if not (report.get('readback') or {}).get('realWebGPU'):raise RuntimeError('SM-403 browser FAIL: real WebGPU evidence missing')
              depth=(report.get('readback') or {}).get('depth') or {}
              if depth.get('valid') is not False or depth.get('lastInvalidationReason')!='sm403:undo':raise RuntimeError(f'SM-403 browser FAIL: production depth state {depth}')
              caps={c.get('id'):c for c in report.get('captures',[])}
              if not {'before-move','after-move','after-reload'} <= set(caps):raise RuntimeError('SM-403 browser FAIL: capture sequence incomplete')
              if caps['before-move']['identity']['decor'][1]['authorId']!=caps['after-move']['identity']['decor'][1]['authorId']:raise RuntimeError('SM-403 browser FAIL: move changed author identity')
              if caps['after-move']['identity']['hash']!=caps['after-reload']['identity']['hash']:raise RuntimeError('SM-403 browser FAIL: save/reload identity mismatch')
              Path('artifacts/webgpu-editor-browser.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8')
              png=cdp.call('Page.captureScreenshot',{'format':'png','fromSurface':True}).get('data','')
              if not png:raise RuntimeError('SM-403 screenshot returned no data')
              Path('artifacts/webgpu-editor-browser.png').write_bytes(base64.b64decode(png))
              Path('artifacts/webgpu-editor-dom.html').write_text(cdp.eval('document.documentElement.outerHTML'),encoding='utf-8')
              print(f"SM-403 WEBGPU EDITOR PASS: {len(checks)} assertions, revision={(report.get('diagnostics') or {}).get('revision')}")
          finally:
            if cdp:cdp.close()
            if proc and proc.poll() is None:
              try:os.killpg(proc.pid,signal.SIGTERM);proc.wait(timeout=4)
              except Exception:
                try:os.killpg(proc.pid,signal.SIGKILL)
                except Exception:pass
            if proc and proc.stderr:
              try:Path('artifacts/sm403-chrome.log').write_text(proc.stderr.read()[-12000:],encoding='utf-8')
              except Exception:pass
            srv.shutdown();srv.server_close()
          PY
      - name: Upload SM-403 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm403-webgpu-editor-evidence
          path: |
            artifacts/webgpu-editor-browser.json
            artifacts/webgpu-editor-browser.png
            artifacts/webgpu-editor-dom.html
            artifacts/sm403-chrome.log
          if-no-files-found: warn
