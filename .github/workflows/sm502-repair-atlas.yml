name: SM-502 repair atlas usage

on:
  push:
    branches: [sm502-colour-pipeline]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sm502-colour-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair atlas external-copy usage
        run: python tools/repair_sm502_atlas_usage.py
      - name: Commit source-only repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engine/webgpu_gbuffer.js
          git diff --cached --check
          git commit -m "SM-502: restore render-attachment atlas copy usage"
          git push origin HEAD:sm502-colour-pipeline
