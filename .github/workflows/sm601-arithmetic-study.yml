name: SM-601 arithmetic audit (software correctness)

on:
  pull_request:
    paths:
      - 'engine/webgpu_gtao.js'
      - 'tools/sm601_gtao_arithmetic_study.js'
      - 'tools/validate_sm601_gtao_arithmetic_study.js'
      - 'tools/run_sm601_gtao_arithmetic_study.py'
      - 'sm601-gtao-arithmetic-study.html'
      - 'docs/SM601_SHADER_ARITHMETIC_MEMORY_AUDIT.md'
      - '.github/workflows/sm601-arithmetic-study.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arithmetic-study:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing browser-driver dependency
        run: python -m pip install --disable-pip-version-check 'websocket-client>=1.8'
      - name: CPU reference, coordinate, format and negative-witness checks
        run: |
          node --check tools/sm601_gtao_arithmetic_study.js
          node --check tools/validate_sm601_gtao_arithmetic_study.js
          python -m py_compile tools/run_sm601_gtao_arithmetic_study.py
          node tools/validate_sm601_gtao_arithmetic_study.js --report artifacts/sm601-arithmetic-cpu.json
      - name: Exact shader A/B on software WebGPU, never target timing
        run: python tools/run_sm601_gtao_arithmetic_study.py --timeout 180 --report artifacts/sm601-arithmetic-browser.json
      - name: Retain exact-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm601-arithmetic-study-${{ github.run_id }}
          path: |
            artifacts/sm601-arithmetic-cpu.json
            artifacts/sm601-arithmetic-browser.json
          if-no-files-found: warn
