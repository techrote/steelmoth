name: SM-503 Material-v2 semantic calibration

on:
  pull_request:
    paths:
      - 'tools/generate_material_v2.py'
      - 'tools/validate_material_v2.py'
      - 'tools/validate_material_v2_semantics.py'
      - 'engine/pseudo_depth.js'
      - 'engine/webgpu_gbuffer.js'
      - 'engine/webgpu_ownership.js'
      - 'engine/webgpu_local_shadows.js'
      - 'assets/generated/atlas.json'
      - 'assets/generated/material_v2_report.json'
      - 'assets/generated/sprite_material_normal_roughness.png'
      - 'assets/generated/sprite_material_height_material.png'
      - 'docs/MATERIAL_V2_SEMANTICS.md'
      - 'docs/material_v2/**'
      - 'MATERIAL_V2_AUDIT.md'
      - 'webgpu-gbuffer-smoke.html'
      - '.github/workflows/sm503-material-semantics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install material tooling
        run: python -m pip install -r tools/requirements-ci.txt
      - name: Regenerate Material-v2 from production albedo
        run: python tools/generate_material_v2.py
      - name: Prove committed generated outputs are deterministic
        run: |
          git diff --exit-code -- \
            assets/generated/atlas.json \
            assets/generated/material_v2_report.json \
            assets/generated/sprite_material_normal_roughness.png \
            assets/generated/sprite_material_height_material.png \
            docs/material_v2/material_v2_representative.png \
            docs/material_v2/material_v2_calibration_8angle.png \
            MATERIAL_V2_AUDIT.md
      - name: Validate calibrated material/height semantics
        run: |
          python tools/validate_material_v2.py
          python tools/validate_material_v2_semantics.py
          node tools/validate_pseudo_depth.js

  real-webgpu-readback:
    needs: deterministic-calibration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser/material harness
        run: python -m pip install -r tools/requirements-ci.txt
      - name: Execute production Material-v2 G-buffer readback
        run: python tools/validate_webgpu_gbuffer_browser.py --require-webgpu --timeout 120 --report artifacts/sm503/webgpu-gbuffer.json
      - name: Upload SM-503 WebGPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm503-material-webgpu-readback
          path: artifacts/sm503/
          if-no-files-found: warn
