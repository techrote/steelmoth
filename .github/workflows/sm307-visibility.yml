name: SM-307 WebGPU visibility composition

on:
  pull_request:
    paths:
      - 'engine/webgpu_visibility.js'
      - 'engine/webgpu_resources.js'
      - 'engine/webgpu_gbuffer.js'
      - 'engine/webgpu_local_shadows.js'
      - 'engine/webgpu_dso_hierarchy.js'
      - 'engine/webgpu_dark_bloom_temporal.js'
      - 'webgpu-visibility-smoke.html'
      - 'tools/validate_webgpu_visibility*'
      - 'docs/WEBGPU_VISIBILITY_SM307.md'
      - 'docs/WEBGPU_ARCHITECTURE.md'
      - 'docs/LIGHTING_FIDELITY_ROADMAP.md'
      - 'webapp.js'
      - 'sw.js'
      - '.github/workflows/sm307-visibility.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sm307-visibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visibility:
    name: bounded composition + toggles + debug + GPU readback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser validation dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
      - name: Validate deterministic visibility model and contract
        run: |
          node --check engine/webgpu_visibility.js
          node tools/validate_webgpu_visibility.js
          python tools/validate_webgpu_visibility_contract.py
      - name: Verify Chrome/Chromium availability
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; \
          elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; \
          elif command -v chromium >/dev/null 2>&1; then chromium --version; \
          else echo 'Chrome/Chromium required for SM-307 WebGPU validation' >&2; exit 1; fi
      - name: Validate bounded composition, toggles, debug views and GTAO contract
        run: python tools/validate_webgpu_visibility_browser.py --require-webgpu --report artifacts/webgpu-visibility-browser.json
      - name: Upload SM-307 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm307-webgpu-visibility-${{ github.run_id }}
          path: |
            artifacts/webgpu-visibility-browser.json
            artifacts/webgpu-visibility-browser.png
          if-no-files-found: warn
