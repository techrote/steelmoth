name: SM-207 WebGPU post

on:
  pull_request:
    paths:
      - 'engine/webgpu_post.js'
      - 'webgpu-post-smoke.html'
      - 'tools/validate_webgpu_post*'
      - 'docs/WEBGPU_POST_SM207.md'
      - 'webapp.js'
      - 'sw.js'
      - '.github/workflows/sm207-post.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sm207-post-${{ github.ref }}
  cancel-in-progress: true

jobs:
  post:
    name: WebGPU bloom + grade + raw bypass + canvas output
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser validation dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
      - name: Validate source and compatibility-control contract
        run: |
          node --check engine/webgpu_post.js
          node tools/validate_webgpu_post.js
          python tools/validate_webgpu_post_contract.py
      - name: Verify Chrome/Chromium availability
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; \
          elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; \
          elif command -v chromium >/dev/null 2>&1; then chromium --version; \
          else echo 'Chrome/Chromium required for SM-207 WebGPU validation' >&2; exit 1; fi
      - name: Validate bloom, grading controls, raw bypass and preferred-format canvas output
        run: python tools/validate_webgpu_post_browser.py --require-webgpu --report artifacts/webgpu-post-browser.json
      - name: Upload SM-207 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm207-webgpu-post-${{ github.run_id }}
          path: artifacts/webgpu-post-browser.json
          if-no-files-found: warn
