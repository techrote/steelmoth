name: SM-600 WebGPU half-resolution GTAO

on:
  pull_request:
    paths:
      - 'engine/webgpu_gtao.js'
      - 'engine/webgpu_depth_hierarchy.js'
      - 'engine/webgpu_visibility.js'
      - 'webgpu-gtao-smoke.html'
      - 'tools/validate_webgpu_gtao.js'
      - 'tools/validate_webgpu_gtao_contract.py'
      - 'tools/validate_webgpu_gtao_browser.py'
      - 'tools/run_checks.py'
      - 'docs/WEBGPU_GTAO_SM600.md'
      - '.github/workflows/sm600-gtao.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gtao:
    name: deterministic + real-browser GTAO
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser validation dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
      - name: Validate deterministic SM-600 GTAO contracts
        run: |
          node --check engine/webgpu_gtao.js
          node tools/validate_webgpu_gtao.js
          python tools/validate_webgpu_gtao_contract.py
      - name: Verify Chrome/Chromium availability
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; \
          elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version; \
          elif command -v chromium >/dev/null 2>&1; then chromium --version; \
          else echo 'Chrome/Chromium required for SM-600 browser validation' >&2; exit 1; fi
      - name: Exercise real WebGPU GTAO and SM-307 composition
        run: python tools/validate_webgpu_gtao_browser.py --report artifacts/sm600-gtao-browser.json
      - name: Upload SM-600 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm600-gtao-${{ github.run_id }}
          path: artifacts/sm600-gtao-browser.json
          if-no-files-found: warn
