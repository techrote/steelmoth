<!doctype html>
<meta charset="utf-8">
<title>Steel Moth SM-207 WebGPU post smoke</title>
<canvas id="postCanvas" width="64" height="64"></canvas>
<pre id="webgpuPostResult">running…</pre>
<script>
(async()=>{
  const result={schema:'steelmoth-webgpu-post-smoke/v1',ok:false,checks:[],samples:{},diagnostics:null};
  const check=(ok,msg,detail=null)=>{result.checks.push({ok:!!ok,msg,detail});if(!ok)throw new Error(msg+(detail?`: ${JSON.stringify(detail)}`:''))};
  const publish=()=>{document.getElementById('webgpuPostResult').textContent=JSON.stringify(result);document.body.dataset.webgpuPostDone='1'};
  try{
    if(!navigator.gpu)throw new Error('navigator.gpu unavailable');
    const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw new Error('requestAdapter returned null');
    const device=await adapter.requestDevice();
    await import('./engine/webgpu_post.js?v=sm207-1');const P=globalThis.SteelMothWebGPUPost;
    check(!!P?.WebGPUPost,'SM-207 post API available');
    check(P.DEFAULTS.bloomThreshold===.70&&P.DEFAULTS.bloomIntensity===1&&P.DEFAULTS.bloomQuality===1,'compatibility bloom defaults exact');
    check(JSON.stringify([0,1,2,3].map(P.bloomPassesForQuality))==='[0,1,2,3]','quality tiers are bounded and monotonic');
    const W=64,H=64,scene=device.createTexture({label:'SM207Scene',size:[W,H],format:'rgba8unorm',usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST});
    const target=device.createTexture({label:'SM207Target',size:[W,H],format:'rgba8unorm',usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.COPY_SRC});
    const px=new Uint8Array(W*H*4);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;px[i]=48;px[i+1]=76;px[i+2]=108;px[i+3]=255;if(x>=28&&x<36&&y>=28&&y<36){px[i]=235;px[i+1]=195;px[i+2]=120}}
    device.queue.writeTexture({texture:scene},px,{bytesPerRow:W*4,rowsPerImage:H},{width:W,height:H});
    const renderer=new P.WebGPUPost({device,width:W,height:H,intermediateFormat:'rgba16float',outputFormat:'rgba8unorm',labelPrefix:'SM207Smoke'});await renderer.initialize();
    const read=async(x,y)=>{const b=device.createBuffer({size:256*H,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ}),e=device.createCommandEncoder();e.copyTextureToBuffer({texture:target},{buffer:b,bytesPerRow:256,rowsPerImage:H},{width:W,height:H,depthOrArrayLayers:1});device.queue.submit([e.finish()]);await b.mapAsync(GPUMapMode.READ);const a=new Uint8Array(b.getMappedRange()),o=y*256+x*4,v=[a[o],a[o+1],a[o+2],a[o+3]];b.unmap();b.destroy();return v};
    const render=async(settings={},grade=[1,1,1],raw=false)=>{const e=device.createCommandEncoder();const meta=renderer.render({encoder:e,sceneView:scene.createView(),outputView:target.createView(),settings,grade,raw});device.queue.submit([e.finish()]);await device.queue.onSubmittedWorkDone();return meta};
    const base={bloom:false,saturation:1,gradeMix:0,vignette:0,grain:0,exposure:1,brightness:0,contrast:1,gamma:1,gradeTemperature:0,gradeTint:0,shadowLift:0,highlightGain:0};
    await render(base,[1,1,1],true);let raw=await read(10,10);result.samples.raw=raw;const rawExpected=[48,76,108].map(v=>Math.round(P.linearChannelToSrgb(v/255)*255));check(raw.slice(0,3).every((v,i)=>Math.abs(v-rawExpected[i])<=1),'raw bypass skips grading/bloom but applies the required linear-to-sRGB display transfer',{raw,rawExpected});
    await render({...base,exposure:.55});const expLow=await read(10,10);await render({...base,exposure:2.0});const expHigh=await read(10,10);result.samples.exposure={low:expLow,high:expHigh};check(expHigh[0]>expLow[0]&&expHigh[1]>expLow[1],'exposure control is monotonic',{expLow,expHigh});
    await render({...base,brightness:-.12});const brLow=await read(10,10);await render({...base,brightness:.12});const brHigh=await read(10,10);check(brHigh[0]>brLow[0]&&brHigh[2]>brLow[2],'brightness control is monotonic',{brLow,brHigh});
    await render({...base,gamma:.65});const gammaLow=await read(10,10);await render({...base,gamma:1.8});const gammaHigh=await read(10,10);check(gammaHigh[0]>gammaLow[0],'gamma raises mid-tones monotonically',{gammaLow,gammaHigh});
    await render({...base,saturation:0});const satLow=await read(10,10);await render({...base,saturation:2});const satHigh=await read(10,10);const spread=a=>Math.max(a[0],a[1],a[2])-Math.min(a[0],a[1],a[2]);check(spread(satLow)<=2&&spread(satHigh)>spread(satLow)+25,'saturation spans grayscale to stronger chroma',{satLow,satHigh});
    await render({...base,gradeMix:0},[1.35,.8,.7]);const gradeOff=await read(10,10);await render({...base,gradeMix:1},[1.35,.8,.7]);const gradeOn=await read(10,10);check(gradeOn[0]>gradeOff[0]&&gradeOn[2]<gradeOff[2],'grade mix moves output toward supplied grade',{gradeOff,gradeOn});
    await render({...base,vignette:.9});const inner=await read(20,20),corner=await read(1,1);check(corner[0]<inner[0]&&corner[1]<inner[1],'vignette attenuates edge relative to same-colour interior',{inner,corner});
    await render({...base,gradeTemperature:-1});const cool=await read(10,10);await render({...base,gradeTemperature:1});const warm=await read(10,10);check(warm[0]>cool[0]&&warm[2]<cool[2],'temperature shifts red/blue in expected directions',{cool,warm});
    await render({...base,bloom:false});const bloomOff=await read(32,32);await render({...base,bloom:true,bloomIntensity:1,bloomThreshold:.35,bloomQuality:1});const bloomOn=await read(32,32);result.samples.bloom={off:bloomOff,on:bloomOn};check(bloomOn[0]>=bloomOff[0]&&bloomOn[1]>=bloomOff[1]&&bloomOn.some((v,i)=>i<3&&v>bloomOff[i]),'restrained bloom adds energy without replacing scene',{bloomOff,bloomOn});
    const q0=await render({...base,bloom:true,bloomIntensity:.5,bloomThreshold:.5,bloomQuality:0});const q3=await render({...base,bloom:true,bloomIntensity:.5,bloomThreshold:.5,bloomQuality:3});check(q0.bloomPasses===0&&q3.bloomPasses===3,'quality setting scales bounded blur-pair count',{q0,q3});

    const preferred=navigator.gpu.getPreferredCanvasFormat();
    const preferredTarget=device.createTexture({label:'SM207PreferredTarget',size:[W,H],format:preferred,usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.COPY_SRC});
    const canvasRenderer=new P.WebGPUPost({device,width:W,height:H,intermediateFormat:'rgba16float',outputFormat:preferred,labelPrefix:'SM207Canvas'});await canvasRenderer.initialize();
    const pe=device.createCommandEncoder();canvasRenderer.render({encoder:pe,sceneView:scene.createView(),outputView:preferredTarget.createView(),settings:{...base,bloom:false},raw:false});device.queue.submit([pe.finish()]);await device.queue.onSubmittedWorkDone();
    check(typeof preferred==='string'&&preferred.length>0,'preferred browser canvas format accepts production final-post pipeline',{preferred});

    const canvas=document.getElementById('postCanvas'),ctx=canvas.getContext('webgpu');ctx.configure({device,format:preferred,alphaMode:'opaque',colorSpace:'srgb'});
    check(!!ctx,'real GPUCanvasContext configures with browser-preferred format',{preferred});
    let swapchainRendered=false,swapchainError=null;
    try{
      const ce=device.createCommandEncoder();canvasRenderer.render({encoder:ce,sceneView:scene.createView(),outputView:ctx.getCurrentTexture().createView(),settings:{...base,bloom:false},raw:true});device.queue.submit([ce.finish()]);await device.queue.onSubmittedWorkDone();swapchainRendered=true;
    }catch(e){swapchainError=String(e?.message||e);if(!/external Instance reference|SharedImage/i.test(swapchainError))throw e}
    result.canvasPresentation={configured:true,swapchainRendered,swapchainError};
    check(swapchainRendered||/external Instance reference|SharedImage/i.test(swapchainError||''),'swapchain presentation succeeds or records Chrome headless shared-image limitation',{swapchainRendered,swapchainError});

    result.diagnostics=renderer.diagnostics();result.canvasDiagnostics=canvasRenderer.diagnostics();
    check(result.diagnostics.schema==='steelmoth-webgpu-post/v1','diagnostics schema exact');
    check(result.diagnostics.intermediateFormat==='rgba16float'&&result.diagnostics.outputFormat==='rgba8unorm','diagnostics expose intermediate and final formats');
    check(result.diagnostics.rawBypass.includes('skipped'),'diagnostics expose raw/debug post bypass');
    check(result.diagnostics.lightingBoundary.includes('SM-204'),'post path does not duplicate direct lighting');
    check(result.diagnostics.colorSpaceBoundary.includes('linear/HDR')&&result.diagnostics.colorSpaceBoundary.includes('sRGB'),'diagnostics expose the corrected linear/HDR to sRGB display boundary');
    check(result.diagnostics.compilation.every(m=>!(m.messages||[]).some(x=>x.type==='error')),'production post WGSL compiles without errors');
    result.preferredCanvasFormat=preferred;result.adapterInfo=adapter.info?Object.fromEntries(Object.entries(adapter.info).filter(([,v])=>typeof v!=='object')):{};result.ok=true;
    renderer.close();canvasRenderer.close();scene.destroy();target.destroy();preferredTarget.destroy();
  }catch(e){result.error=String(e?.stack||e)}finally{publish()}
})();
</script>
