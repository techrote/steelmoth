<!doctype html>
<meta charset="utf-8">
<title>Steel Moth SM-504 shared tile/light culling smoke</title>
<pre id="webgpuTileCullingResult">running…</pre>
<script type="module">
const result={schema:'steelmoth-webgpu-tile-culling-browser-smoke/v1',ok:false,checks:[],diagnostics:null,gpu:null,error:null};
const check=(ok,label,detail=null)=>{result.checks.push({ok:!!ok,label,detail});if(!ok)throw new Error(label+(detail?`: ${JSON.stringify(detail)}`:''))};
const publish=()=>{document.getElementById('webgpuTileCullingResult').textContent=JSON.stringify(result);document.body.dataset.webgpuTileCullingDone='1'};
try{
  if(!navigator.gpu)throw new Error('navigator.gpu unavailable');let adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});if(!adapter)adapter=await navigator.gpu.requestAdapter({forceFallbackAdapter:true});if(!adapter)throw new Error('requestAdapter returned null');const device=await adapter.requestDevice();
  await import('./engine/webgpu_resources.js?v=sm504-1');await import('./engine/webgpu_gbuffer.js?v=sm504-1');await import('./engine/webgpu_occluders.js?v=sm504-1');await import('./engine/webgpu_lighting.js?v=sm504-1');await import('./engine/webgpu_tile_culling.js?v=sm504-1');
  const O=globalThis.SteelMothWebGPUOccluders,L=globalThis.SteelMothWebGPULighting,T=globalThis.SteelMothWebGPUTileCulling;check(!!T?.WebGPUSharedTileBuffers,'SM-504 GPU buffer API available');
  const scene={frame:{roomId:'sm504-browser',logicalSize:[256,128]},occluders:[{id:'machine',rect:[24,24,72,88],root:{x:48,y:88},kind:'machine',majorOccluder:true,sections:[{z:24}]},{id:'robot',rect:[180,50,208,94],root:{x:194,y:94},kind:'robot',dynamic:true,majorOccluder:true,sections:[{z:18}]}]};
  const occ=O.buildOccluderSnapshot(scene,{tileSize:32,maxOccluders:64,maxPerTile:16,maxTileRefs:512}),settings={lighting:true,ambient:.3,emissive:1,lightRadius:1,normalStrength:1,heightStrength:1,roughnessScale:1,metalnessScale:1,materialAOStrength:.62,pbrSpecularStrength:.70},lightScene={lights:[{id:'left',x:48,y:48,z:20,radius:58,intensity:1,color:[1,.9,.8]},{id:'right',x:210,y:80,z:18,radius:46,intensity:.8,color:[.7,.85,1]}]},lights=L.buildCanonicalLights(lightScene,settings);let snapshot=T.buildSharedTileSnapshot(occ,lights,{maxLightRefs:512});
  check(T.sameGrid(snapshot.grid,occ.grid),'shared snapshot reuses SM-300 grid');check(snapshot.diagnostics.workReduction>.45,'hosted fixture materially reduces candidate pixel-light work',snapshot.diagnostics);check(snapshot.diagnostics.droppedLightRefs===0,'no light refs dropped');
  const fakeHeaders=new Uint32Array(snapshot.grid.count*2);for(const i of [0,1,8,9]){fakeHeaders[i*2]=0;fakeHeaders[i*2+1]=1}const fakePlan={roomId:snapshot.roomId,grid:snapshot.grid,tileHeaders:fakeHeaders,signature:504};snapshot=T.withDSORelevance(snapshot,fakePlan);const dsoWork=T.buildDSOWork(fakePlan,snapshot,8);check(dsoWork.activeTileCount===4,'DSO relevance consumes shared tile authority');check(dsoWork.workReduction>.5,'DSO compact workgroup plan skips unaffected tiles',dsoWork);
  const buffers=new T.WebGPUSharedTileBuffers({device,labelPrefix:'SM504Smoke'});buffers.update(snapshot);const rb=await buffers.readback();check(rb.tileRecords.length===snapshot.tileRecords.length,'GPU tile-record readback length exact');check(rb.tileRecords.every((v,i)=>v===snapshot.tileRecords[i]),'GPU tile-record upload/readback exact');check(rb.lightRefs.every((v,i)=>v===snapshot.lightRefs[i]),'GPU light-ref upload/readback exact');
  const bindings=buffers.bindings(),out=device.createBuffer({label:'SM504Smoke:counts',size:snapshot.grid.count*4,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC}),read=device.createBuffer({label:'SM504Smoke:counts-read',size:snapshot.grid.count*4,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
  const shader=device.createShaderModule({label:'SM504Smoke:consumer',code:`@group(0) @binding(0) var<storage,read> records:array<vec4u>; @group(0) @binding(1) var<storage,read> refs:array<u32>; @group(0) @binding(2) var<storage,read_write> counts:array<u32>; @compute @workgroup_size(64) fn main(@builtin(global_invocation_id) gid:vec3u){if(gid.x>=${snapshot.grid.count}u){return;}let r=records[gid.x];var n=0u;for(var i=0u;i<r.w;i++){n+=select(0u,1u,refs[r.z+i]<${L.MAX_LIGHTS}u);}counts[gid.x]=n;}`});const info=await shader.getCompilationInfo();check(!info.messages.some(m=>m.type==='error'),'consumer WGSL compiles',info.messages.map(m=>m.message));const pipeline=await device.createComputePipelineAsync({label:'SM504Smoke:consumer-pipeline',layout:'auto',compute:{module:shader,entryPoint:'main'}}),bind=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:bindings.tileRecords}},{binding:1,resource:{buffer:bindings.lightRefs}},{binding:2,resource:{buffer:out}}]}),enc=device.createCommandEncoder();const pass=enc.beginComputePass();pass.setPipeline(pipeline);pass.setBindGroup(0,bind);pass.dispatchWorkgroups(Math.ceil(snapshot.grid.count/64));pass.end();enc.copyBufferToBuffer(out,0,read,0,snapshot.grid.count*4);device.queue.submit([enc.finish()]);await read.mapAsync(GPUMapMode.READ);const gpuCounts=new Uint32Array(read.getMappedRange().slice(0));read.unmap();for(let i=0;i<snapshot.grid.count;i++)check(gpuCounts[i]===snapshot.tileRecords[i*4+3],`GPU consumer sees tile ${i} light count`);out.destroy();read.destroy();
  const sample={g0:[.34,.42,.50,1],g1:[.5,.5,1,.78],g2:[.14,.25,1,0]};let maxError=0;for(let y=8;y<128;y+=16)for(let x=8;x<256;x+=16){const a=L.shadePixelReference(sample,lights,settings,[x+.5,y+.5],'final'),b=T.shadePixelReferenceCulled(sample,lights,snapshot,settings,[x+.5,y+.5],'final');for(let c=0;c<4;c++)maxError=Math.max(maxError,Math.abs(a[c]-b[c]))}check(maxError<2e-6,'culled direct-light reference preserves output',{maxError});
  result.diagnostics=buffers.diagnostics();result.gpu={adapter:adapter.info?{vendor:adapter.info.vendor||'',architecture:adapter.info.architecture||'',device:adapter.info.device||'',description:adapter.info.description||''}:{},tileCount:snapshot.grid.count,lightRefs:snapshot.diagnostics.lightRefCount,lightWorkReduction:snapshot.diagnostics.workReduction,dsoWorkReduction:dsoWork.workReduction,maxDirectError:maxError,realWebGPU:true};result.ok=true;buffers.close();
}catch(error){result.error=String(error?.stack||error)}finally{publish()}
</script>
