<!doctype html>
<meta charset="utf-8">
<title>Steel Moth SM-306 WebGPU Dark Bloom temporal smoke</title>
<canvas id="temporalDebug" width="576" height="144"></canvas>
<pre id="webgpuDarkBloomTemporalResult"></pre>
<script type="module">
const result={schema:'steelmoth-webgpu-dark-bloom-temporal-browser-smoke/v1',ok:false,checks:[],captures:[],diagnostics:null,readback:null,timing:{timestampQueryAvailable:false,gpuTimingClaimed:false,submitWallMs:[]},error:null};
const check=(ok,label)=>{result.checks.push({ok:!!ok,label});if(!ok)throw new Error(label)};
const publish=()=>{document.getElementById('webgpuDarkBloomTemporalResult').textContent=JSON.stringify(result);document.body.dataset.webgpuDarkBloomTemporalDone='1'};
const maxError=(a,b)=>{let m=0;for(let i=0;i<Math.min(a.length,b.length);i++)m=Math.max(m,Math.abs(a[i]-b[i]));return m};
const allZero=a=>Array.from(a).every(v=>v===0);
try{
  if(!navigator.gpu)throw new Error('navigator.gpu unavailable');
  const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw new Error('requestAdapter returned null');result.timing.timestampQueryAvailable=adapter.features?.has?.('timestamp-query')||false;
  const device=await adapter.requestDevice();
  await import('./engine/webgpu_resources.js?v=sm103-1');
  await import('./engine/webgpu_dark_bloom_temporal.js?v=sm306-1');
  const T=globalThis.SteelMothWebGPUDarkBloomTemporal;check(!!T?.WebGPUDarkBloomTemporal,'SM-306 temporal API available');check(T.SCHEMA==='steelmoth-webgpu-dark-bloom-temporal/v1','stable SM-306 schema available');
  const width=64,height=48,count=width*height;
  const makeField=(cx,cy,amp=.42,radius=10)=>{const out=new Float32Array(count);for(let y=0;y<height;y++)for(let x=0;x<width;x++){const d=Math.hypot(x-cx,y-cy);out[y*width+x]=d<=radius?amp*Math.max(0,1-d/(radius+1)):0}return out};
  const hard=new Float32Array(count),objects=new Uint32Array(count),depth=new Float32Array(count*2);for(let i=0;i<count;i++){depth[i*2]=.8;depth[i*2+1]=.8}for(let y=17;y<29;y++)for(let x=12;x<24;x++){hard[y*width+x]=1;objects[y*width+x]=41;}
  const a=makeField(39,23),b=makeField(40,23),c=makeField(47,23);for(let i=0;i<count;i++)if(hard[i]){a[i]=0;b[i]=0;c[i]=0;}
  const residualTexture=device.createTexture({label:'SM306 current residual',size:{width,height,depthOrArrayLayers:1},format:'r32float',usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST});
  const hardTexture=device.createTexture({label:'SM306 hard core',size:{width,height,depthOrArrayLayers:1},format:'r32float',usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST});
  const depthTexture=device.createTexture({label:'SM306 depth',size:{width,height,depthOrArrayLayers:1},format:'rg32float',usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST});
  const objectTexture=device.createTexture({label:'SM306 object ids',size:{width,height,depthOrArrayLayers:1},format:'r32uint',usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST});
  const writeF=(texture,data,bpp)=>device.queue.writeTexture({texture},data,{bytesPerRow:width*bpp,rowsPerImage:height},{width,height,depthOrArrayLayers:1});
  writeF(hardTexture,hard,4);writeF(depthTexture,depth,8);writeF(objectTexture,objects,4);
  const cluster0={jobs:[{clusterId:7,ownerObjectId:41,memberIds:[41,42],clusterBounds:[12,17,30,29]}]},clusterMoved={jobs:[{clusterId:7,ownerObjectId:41,memberIds:[41,42],clusterBounds:[28,17,46,29]}]};
  const light0={id:'player',direction:[1,0],position:[20,24]},lightSlow={id:'player',direction:[Math.cos(Math.PI/90),Math.sin(Math.PI/90)],position:[21,24]},lightTeleport={id:'player',direction:[0,1],position:[90,24]};
  const temporal=new T.WebGPUDarkBloomTemporal({device,width,height,historyWeight:.72,depthThreshold:.02,maxLightAngleDeg:6,maxLightMovePixels:12});
  const source=(roomId,clusterState,lightState)=>({currentResidualView:residualTexture.createView(),hardMaskView:hardTexture.createView(),depthRangeView:depthTexture.createView(),objectIdView:objectTexture.createView(),width,height,roomId,clusterState,lightState});
  const run=async(label,current,src)=>{writeF(residualTexture,current,4);const t0=performance.now();const diag=await temporal.update(src);const gpu=await temporal.readback();result.timing.submitWallMs.push({label,value:performance.now()-t0});return{diag,gpu}};
  const first=await run('first',a,source('room-a',cluster0,light0));check(maxError(first.gpu,a)<2e-5,'uninitialized history resolves exactly to current Dark Bloom');check(first.diag.snapshot.globalReject===true,'first frame explicitly rejects undefined history');check(first.diag.snapshot.diagnostics.historyAcceptedPercent===0,'first frame reports zero history acceptance');check(first.diag.snapshot.diagnostics.historyRejectedPercent>90,'first frame rejects the complete eligible soft-history field; hard-core pixels remain outside temporal accumulation');
  const expectedSlow=T.temporalReference({width,height,current:b,hardMask:hard,currentDepth:depth,currentObject:objects,previous:first.gpu,previousDepth:depth,previousObject:objects,historyValid:true,globalReject:false},{historyWeight:.72,depthThreshold:.02});
  const slow=await run('slow-light',b,source('room-a',cluster0,lightSlow));const slowError=maxError(slow.gpu,expectedSlow.full);check(slowError<2e-5,'slow-light GPU temporal residual matches CPU reference');check(slow.diag.snapshot.globalReject===false,'slow 2 degree/1px light motion retains history');check(slow.diag.snapshot.diagnostics.historyAcceptedPercent>90,'stable soft field reports high history acceptance');check(T.rmsDelta(slow.gpu,first.gpu)<T.rmsDelta(b,a),'slow-light temporal field reduces frame-to-frame penumbra change');let coreViolation=0;for(let i=0;i<count;i++)if(hard[i]>.5&&Math.abs(slow.gpu[i])>1e-7)coreViolation++;check(coreViolation===0,'hard DSO core never receives temporal residual');check(slow.diag.snapshot.diagnostics.hardCoreUnsmooth===true,'diagnostics state hard-core unsmoothed contract');check(slow.diag.snapshot.diagnostics.neighborhoodClamp===true,'diagnostics expose neighborhood anti-trail clamp');
  const tele=await run('light-teleport',c,source('room-a',cluster0,lightTeleport));check(maxError(tele.gpu,c)<2e-5,'light teleport rejects history and returns current residual exactly');check(tele.diag.snapshot.globalReject===true,'light teleport forces global history rejection');check(/^light-/.test(tele.diag.snapshot.resetReason),'light teleport reset reason is explicit');check(tele.diag.snapshot.diagnostics.historyAcceptedPercent===0,'light teleport reports zero accepted history');
  const settled=await run('settled-after-teleport',c,source('room-a',cluster0,lightTeleport));check(settled.diag.snapshot.globalReject===false,'settled frame after teleport accepts history again');
  const changedObjects=Uint32Array.from(objects),objectProbe=23*width+43;changedObjects[objectProbe]=99;writeF(objectTexture,changedObjects,4);const objectChange=await run('object-change',c,source('room-a',cluster0,lightTeleport));check(objectChange.diag.snapshot.globalReject===false,'single object-ID discontinuity remains pixel-local');check(objectChange.diag.snapshot.diagnostics.object>=1,'object discontinuity increments rejection diagnostics');check(Math.abs(objectChange.gpu[objectProbe]-c[objectProbe])<2e-5,'changed object pixel uses current residual without stale history');
  writeF(objectTexture,objects,4);await run('ownership-restored',c,source('room-a',cluster0,lightTeleport));const changedDepth=Float32Array.from(depth),depthProbe=23*width+44;changedDepth[depthProbe*2]=.45;changedDepth[depthProbe*2+1]=.45;writeF(depthTexture,changedDepth,8);const depthChange=await run('depth-change',c,source('room-a',cluster0,lightTeleport));check(depthChange.diag.snapshot.diagnostics.depth>=1,'depth discontinuity increments rejection diagnostics');check(Math.abs(depthChange.gpu[depthProbe]-c[depthProbe])<2e-5,'changed depth pixel uses current residual without stale history');
  writeF(depthTexture,depth,8);await run('depth-restored',c,source('room-a',cluster0,lightTeleport));const moved=await run('cluster-move',b,source('room-a',clusterMoved,lightTeleport));check(maxError(moved.gpu,b)<2e-5,'large cluster movement globally rejects prior soft history');check(moved.diag.snapshot.resetReason==='cluster-discontinuity','cluster movement reset reason is explicit');check(moved.diag.snapshot.diagnostics.historyAcceptedPercent===0,'cluster movement reports zero accepted history');
  const room=await run('room-change',b,source('room-b',clusterMoved,lightTeleport));check(maxError(room.gpu,b)<2e-5,'room change rejects prior-room history exactly');check(room.diag.snapshot.resetReason==='room-change','room change reset reason is explicit');
  const zero=new Float32Array(count);temporal.invalidate('editor-delete');let staleRejected=false;try{temporal.bindings()}catch(_e){staleRejected=true}check(staleRejected,'explicit invalidation rejects stale history bindings');const cleared=await run('editor-delete',zero,source('room-b',clusterMoved,lightTeleport));check(allZero(cleared.gpu),'editor deletion plus invalidation leaves no stale bin silhouette');check(cleared.diag.snapshot.diagnostics.historyAcceptedPercent===0,'editor invalidation reports zero history acceptance on rebuild');
  temporal.resize(width+2,height+2);let resizeRejected=false;try{temporal.bindings()}catch(_e){resizeRejected=true}check(resizeRejected,'resize invalidates temporal bindings immediately');temporal.resize(width,height);const resized=await run('resize-rebuild',b,source('room-b',clusterMoved,lightTeleport));check(maxError(resized.gpu,b)<2e-5,'post-resize rebuild starts from current residual without stale history');check(resized.diag.snapshot.globalReject===true,'post-resize first frame globally rejects old history');
  const overlay=temporal.debugOverlay();check(Number.isFinite(overlay.acceptedPercent)&&Number.isFinite(overlay.rejectedPercent),'debug overlay exposes accepted/rejected history percentages');check(/Hard DSO\/object ownership is never smoothed/.test(overlay.contract),'debug overlay states hard ownership scope boundary');
  const canvas=document.getElementById('temporalDebug'),ctx=canvas.getContext('2d');
  const draw=(values,index,label)=>{const img=ctx.createImageData(width,height);for(let i=0;i<values.length;i++){const v=Math.min(1,Math.max(0,values[i])*3),o=i*4;img.data[o]=Math.round(v*90);img.data[o+1]=Math.round(v*180);img.data[o+2]=Math.round(v*255);img.data[o+3]=255}ctx.putImageData(img,index*width,0);ctx.fillStyle='white';ctx.font='10px monospace';ctx.fillText(label,index*width+3,11)};draw(a,0,'raw A');draw(b,1,'raw B');draw(slow.gpu,2,'temporal B');draw(c,3,'teleport');draw(moved.gpu,4,'cluster reset');draw(cleared.gpu,5,'cleared');
  result.captures=[{label:'slow-light',gpuCpuMaxError:slowError,rawRms:T.rmsDelta(b,a),temporalRms:T.rmsDelta(slow.gpu,first.gpu),acceptedPercent:slow.diag.snapshot.diagnostics.historyAcceptedPercent,rejectedPercent:slow.diag.snapshot.diagnostics.historyRejectedPercent},{label:'light-teleport',maxError:maxError(tele.gpu,c),acceptedPercent:tele.diag.snapshot.diagnostics.historyAcceptedPercent,resetReason:tele.diag.snapshot.resetReason},{label:'cluster-move',maxError:maxError(moved.gpu,b),resetReason:moved.diag.snapshot.resetReason},{label:'editor-delete',nonzero:Array.from(cleared.gpu).filter(v=>v!==0).length},{label:'resize-rebuild',maxError:maxError(resized.gpu,b)}];
  result.diagnostics=temporal.diagnostics();result.readback={format:'r32float',pixelCount:count,gpuCpuTolerance:2e-5,slowLightStabilized:result.captures[0].temporalRms<result.captures[0].rawRms,hardCoreUnsmooth:coreViolation===0,teleportRejected:tele.diag.snapshot.diagnostics.historyAcceptedPercent===0,objectRejected:objectChange.diag.snapshot.diagnostics.object>=1,depthRejected:depthChange.diag.snapshot.diagnostics.depth>=1,clusterRejected:moved.diag.snapshot.resetReason==='cluster-discontinuity',roomRejected:room.diag.snapshot.resetReason==='room-change',resizeRejected,noStaleAfterInvalidation:allZero(cleared.gpu)};result.ok=true;
  temporal.close();residualTexture.destroy();hardTexture.destroy();depthTexture.destroy();objectTexture.destroy();
}catch(error){result.error=String(error?.stack||error)}finally{publish()}
</script>
