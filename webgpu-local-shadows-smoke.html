<!doctype html>
<meta charset="utf-8">
<title>Steel Moth SM-205 WebGPU local shadows smoke</title>
<pre id="webgpuLocalShadowsResult">running…</pre>
<script>
(async()=>{
  const result={schema:'steelmoth-webgpu-local-shadows-smoke/v1',ok:false,checks:[],controls:{},synthetic:null,diagnostics:null};
  const check=(ok,msg,detail=null)=>{result.checks.push({ok:!!ok,msg,detail});if(!ok)throw new Error(msg+(detail?`: ${JSON.stringify(detail)}`:''))};
  const loadBitmap=async url=>{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`${url}: HTTP ${r.status}`);return createImageBitmap(await r.blob())};
  const publish=()=>{document.getElementById('webgpuLocalShadowsResult').textContent=JSON.stringify(result);document.body.dataset.webgpuLocalShadowsDone='1'};
  try{
    if(!navigator.gpu)throw new Error('navigator.gpu unavailable');const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw new Error('requestAdapter returned null');const device=await adapter.requestDevice();
    await import('./engine/webgpu_resources.js?v=sm103-1');await import('./engine/pseudo_depth.js?v=sm201-1');await import('./engine/webgpu_gbuffer.js?v=sm200-1');await import('./engine/webgpu_ownership.js?v=sm202-1');await import('./engine/webgpu_lighting.js?v=sm204-1');await import('./engine/webgpu_local_shadows.js?v=sm205-1');
    const R=globalThis.SteelMothWebGPUResources,O=globalThis.SteelMothWebGPUOwnership,S=globalThis.SteelMothWebGPULocalShadows;
    check(!!S?.WebGPULocalShadows,'SM-205 local-shadow pass available');check(JSON.stringify(S.SELF_QUALITY_SAMPLES)==='[0,8,12,16,28]','self-shadow quality/sample caps exact');check(JSON.stringify(S.CONTACT_QUALITY_SAMPLES)==='[0,4,8,12]','contact-shadow quality/sample caps exact');

    // Production Material-v2 controls, eight light angles each.
    const meta=await (await fetch('assets/generated/atlas.json',{cache:'no-store'})).json(),[albedo,nr,hm]=await Promise.all([loadBitmap(meta.image),loadBitmap(meta.material_normal_roughness_image),loadBitmap(meta.material_height_image)]),width=640,height=360;
    const gb=new O.WebGPUOwnershipGBuffer({device,width,height,maxInstances:32,labelPrefix:'SM205Prod'});await gb.setAtlases({albedo,normalRoughness:nr,heightMaterial:hm,meta});
    const names=['cargo_crate','rust_barrel','server_cabinet','hex_maintenance_idle_0'],xs=[100,245,390,535],sprites=[];
    for(let i=0;i<names.length;i++){const name=names[i],r=meta.regions[name];check(Array.isArray(r),`production control exists: ${name}`);const w=r[2]*meta.world_scale,h=r[3]*meta.world_scale,y=180;sprites.push({id:`control:${name}`,atlas:'hd',category:'dynamic',spriteId:name,materialId:null,transform:{x:xs[i],y,w,h,rotation:0,flip:false},root:{x:xs[i],y:y+h*.5},style:{alpha:1,tint:[1,1,1],glow:false,materialMode:'normal'},depthLayer:0,depthBias:0})}
    await gb.renderScene({sprites,materials:[],lights:[]},meta);const prodShadow=new S.WebGPULocalShadows({device,width,height,registry:gb.registry,pipelines:gb.pipelines,labelPrefix:'SM205ProdShadow'});await prodShadow.initialize();const samplePoints={};
    for(let i=0;i<names.length;i++){let found=null;outer:for(let dy=-10;dy<=10;dy+=2)for(let dx=-10;dx<=10;dx+=2){const x=Math.round(xs[i]+dx),y=180+dy,p=await gb.readPixel(x,y);if(p.objectId){found={x,y,p};break outer}}check(!!found,`covered production sample found: ${names[i]}`);samplePoints[names[i]]=found}
    const settings={lighting:true,heightStrength:1,selfShadowing:true,selfShadowQuality:3,selfShadowLightCount:1,selfShadowBias:1.15,selfShadowMaxDistance:72,contactShadows:true,contactShadowQuality:2,contactShadowDistance:20,contactShadowStrength:.58,lightRadius:1,emissive:1};
    const angles=[0,45,90,135,180,225,270,315];
    for(const name of names){const s=samplePoints[name],rows=[];for(const angle of angles){const a=angle*Math.PI/180,r=70,scene={lights:[{id:'light:control:0',group:'control',x:s.x+Math.cos(a)*r,y:s.y+Math.sin(a)*r,z:24,radius:180,intensity:1,color:[1,1,1]}]};await prodShadow.render(gb,scene,settings);const visibility=await prodShadow.readSelfPixel(s.x,s.y);check(Number.isFinite(visibility)&&visibility>=0&&visibility<=1.001,`${name} ${angle}° self visibility bounded`,{visibility});rows.push({angle,visibility})}result.controls[name]=rows}
    check(Object.values(result.controls).every(rows=>rows.length===8),'crate/barrel/cabinet/robot eight-angle matrix complete');

    // Deterministic contact-distance fixture: an opaque low surface lies to the right
    // of a high local-height step. This uses the same production SM-205 WGSL passes.
    const sw=64,sh=32,registry=new R.ResourceRegistry({device,queue:device.queue,width:sw,height:sh,labelPrefix:'SM205Synthetic'}),usage=GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST;
    registry.defineTexture('sm200:g0',{format:'rgba8unorm',usage,size:'surface'});registry.defineTexture('sm200:g2',{format:'rgba32float',usage,size:'surface'});const g0=new Uint8Array(sw*sh*4),g2=new Float32Array(sw*sh*4);
    for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){const i=(y*sw+x)*4;g0[i]=180;g0[i+1]=170;g0[i+2]=160;g0[i+3]=255;g2[i]=x<32?.80:.05;g2[i+1]=0;g2[i+2]=1;g2[i+3]=0}
    device.queue.writeTexture({texture:registry.require('sm200:g0').handle},g0,{bytesPerRow:sw*4,rowsPerImage:sh},{width:sw,height:sh,depthOrArrayLayers:1});device.queue.writeTexture({texture:registry.require('sm200:g2').handle},g2,{bytesPerRow:sw*16,rowsPerImage:sh},{width:sw,height:sh,depthOrArrayLayers:1});
    const fake={registry},pipes=new R.PipelineCache(device,{labelPrefix:'SM205SyntheticPipe'}),syn=new S.WebGPULocalShadows({device,width:sw,height:sh,registry,pipelines:pipes,labelPrefix:'SM205SyntheticShadow'}),lightScene={lights:[{id:'light:step',group:'control',x:8,y:16,z:24,radius:100,intensity:1,color:[1,1,1]}]},synSettings={...settings,selfShadowMaxDistance:30,contactShadowDistance:20};
    await syn.render(fake,lightScene,synSettings);const nearSelf=await syn.readSelfPixel(35,16),nearContact=await syn.readContactVisibilityPixel(35,16),far20=await syn.readContactVisibilityPixel(55,16);check(nearSelf<.9,'synthetic height step produces bounded self shadow',{nearSelf});check(nearContact<.99,'synthetic height step produces short-range contact shadow',{nearContact});check(far20>.985,'20 px contact distance does not become a macro shadow',{far20});
    await syn.render(fake,lightScene,{...synSettings,contactShadowDistance:36});const far36=await syn.readContactVisibilityPixel(55,16);check(far36<far20-.01,'explicitly larger contact distance reaches farther fixture without changing default',{far20,far36});
    await syn.render(fake,lightScene,{...synSettings,selfShadowing:false,contactShadows:false});const disabledSelf=await syn.readSelfPixel(35,16),disabledContact=await syn.readContactVisibilityPixel(35,16);check(Math.abs(disabledSelf-1)<.002&&Math.abs(disabledContact-1)<.002,'local shadow passes disable to fully visible masks',{disabledSelf,disabledContact});
    const diag=syn.diagnostics();check(diag.depthHierarchyReuse?.used===false&&String(diag.depthHierarchyReuse?.reason||'').includes('local Material-v2 height'),'SM-203 ownership hierarchy is not misused as local-height parity data');check(diag.composition.includes('SM-307'),'SM-205 exposes visibility masks without taking final shadow-composition ownership');check(diag.timing?.gpuMs===null&&Number.isFinite(diag.timing?.cpuSubmitWaitMs),'initial timing is labeled CPU submit/wait wall time, never fabricated GPU timing');
    result.synthetic={nearSelf,nearContact,far20,far36,disabledSelf,disabledContact};result.diagnostics=diag;result.adapterInfo=adapter.info?Object.fromEntries(Object.entries(adapter.info).filter(([,v])=>typeof v!=='object')):{};result.ok=true;
    registry.close();gb.close();albedo.close();nr.close();hm.close();
  }catch(e){result.error=String(e?.stack||e)}finally{publish()}
})();
</script>
