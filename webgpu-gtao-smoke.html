<!doctype html>
<meta charset="utf-8">
<title>SteelMoth SM-600 GTAO smoke</title>
<style>body{margin:0;background:#101318;color:#dfe7ef;font:14px ui-monospace,monospace}h1{font-size:16px;margin:12px}canvas{margin:12px;border:1px solid #59636f;image-rendering:pixelated;width:512px;height:320px}pre{white-space:pre-wrap;margin:12px;max-width:1100px}</style>
<h1>SM-600 half-resolution GTAO · canonical depth/normal · depth-aware upscale</h1>
<canvas id="view" width="512" height="320"></canvas>
<pre id="webgpuGtaoResult">running…</pre>
<script src="engine/webgpu_resources.js"></script>
<script src="engine/webgpu_depth_hierarchy.js"></script>
<script src="engine/webgpu_gtao.js"></script>
<script src="engine/webgpu_visibility.js"></script>
<script>
(async()=>{
  const result={schema:'steelmoth-webgpu-gtao-smoke/v1',ok:false,checks:[],gpu:{realWebGPU:false},captures:[],timing:{gpuTimingClaimed:false}};
  const check=(ok,label,extra={})=>{result.checks.push({ok:!!ok,label,...extra});if(!ok)throw new Error(label)};
  const maxError=(a,b)=>{let m=0;for(let i=0;i<Math.min(a.length,b.length);i++)m=Math.max(m,Math.abs(a[i]-b[i]));return m};
  const mean=a=>a.length?Array.from(a).reduce((s,v)=>s+v,0)/a.length:1;
  try{
    check(!!navigator.gpu,'navigator.gpu available');let adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});if(!adapter){adapter=await navigator.gpu.requestAdapter({forceFallbackAdapter:true});result.gpu.fallbackAdapterRequested=true;}check(!!adapter,'WebGPU adapter acquired');const device=await adapter.requestDevice();result.gpu.adapter={isFallbackAdapter:!!adapter.isFallbackAdapter,info:adapter.info||null};
    const D=globalThis.SteelMothWebGPUDepthHierarchy,G=globalThis.SteelMothWebGPUGTAO,V=globalThis.SteelMothWebGPUVisibility;check(D?.SCHEMA==='steelmoth-webgpu-depth-hierarchy/v1','SM-203 production hierarchy loaded');check(G?.SCHEMA==='steelmoth-webgpu-gtao/v1','SM-600 module loaded');check(V?.SCHEMA==='steelmoth-webgpu-visibility/v1','SM-307 consumer loaded');
    const width=64,height=40,count=width*height;
    const depthTex=device.createTexture({label:'SM600 source depth',size:{width,height,depthOrArrayLayers:1},format:'depth32float',usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_SRC});
    const objectTex=device.createTexture({label:'SM600 source object',size:{width,height,depthOrArrayLayers:1},format:'r32uint',usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_SRC});
    const normalTex=device.createTexture({label:'SM600 source normal',size:{width,height,depthOrArrayLayers:1},format:'rgba16float',usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_SRC});
    const srcShader=device.createShaderModule({code:`
      @vertex fn vs_main(@builtin(vertex_index) vi:u32)->@builtin(position) vec4f{let p=array<vec2f,3>(vec2f(-1,-1),vec2f(3,-1),vec2f(-1,3));return vec4f(p[vi],0,1);}
      struct Out{@location(0) oid:u32,@location(1) normal:vec4f,@builtin(frag_depth) depth:f32};
      @fragment fn fs_main(@builtin(position) p:vec4f)->Out{let q=vec2u(p.xy);var o:Out;o.oid=1u;o.depth=.62;o.normal=vec4f(.5,.5,1,.55);
        if(q.x>=24u&&q.x<40u&&q.y>=10u&&q.y<31u){o.oid=2u;o.depth=.34;}
        if(q.x>=8u&&q.x<20u&&q.y>=12u&&q.y<30u){o.oid=3u;o.depth=.39;}
        if(q.x>=43u&&q.x<56u&&q.y>=8u&&q.y<33u){o.oid=4u;o.depth=.31;}
        return o;}
    `});const info=await srcShader.getCompilationInfo();check(!(info.messages||[]).some(m=>m.type==='error'),'source fixture WGSL compiles',{messages:Array.from(info.messages||[]).map(m=>m.message)});
    const srcPipeline=device.createRenderPipeline({layout:'auto',vertex:{module:srcShader,entryPoint:'vs_main'},fragment:{module:srcShader,entryPoint:'fs_main',targets:[{format:'r32uint'},{format:'rgba16float'}]},primitive:{topology:'triangle-list'},depthStencil:{format:'depth32float',depthWriteEnabled:true,depthCompare:'always'}});
    {const e=device.createCommandEncoder(),p=e.beginRenderPass({colorAttachments:[{view:objectTex.createView(),clearValue:{r:0,g:0,b:0,a:0},loadOp:'clear',storeOp:'store'},{view:normalTex.createView(),clearValue:{r:.5,g:.5,b:1,a:.55},loadOp:'clear',storeOp:'store'}],depthStencilAttachment:{view:depthTex.createView(),depthClearValue:1,depthLoadOp:'clear',depthStoreOp:'store'}});p.setPipeline(srcPipeline);p.draw(3);p.end();device.queue.submit([e.finish()]);await device.queue.onSubmittedWorkDone();}
    const hierarchy=new D.WebGPUDepthHierarchy({device,width,height});await hierarchy.build({depthTexture:depthTex,objectIdTexture:objectTex,width,height});check(hierarchy.valid,'canonical SM-203 hierarchy built');
    const gtao=new G.WebGPUGTAO({device,width,height});const cfg={directions:6,steps:4,radius:12,intensity:1.1,debugMode:'visibility'};await gtao.update({width,height,depthRangeView:hierarchy.levelView(0),normalView:normalTex.createView(),depthHierarchy:hierarchy},cfg);const vis=await gtao.readback();check(vis.length===count,'full-resolution GTAO readback available');check(Array.from(vis).every(v=>Number.isFinite(v)&&v>=0&&v<=1),'GTAO visibility is finite and bounded');const metrics=G.fieldMetrics(vis);check(metrics.occludedPixels>40,'scene produces non-trivial inter-surface AO',{metrics});check(metrics.min>=.149,'GTAO remains bounded away from black',{metrics});
    const depthRanges=new Float32Array(count*2),normals=new Float32Array(count*4);for(let y=0;y<height;y++)for(let x=0;x<width;x++){const i=y*width+x;let d=.62;if(x>=24&&x<40&&y>=10&&y<31)d=.34;else if(x>=8&&x<20&&y>=12&&y<30)d=.39;else if(x>=43&&x<56&&y>=8&&y<33)d=.31;depthRanges[i*2]=d;depthRanges[i*2+1]=d;normals[i*4]=.5;normals[i*4+1]=.5;normals[i*4+2]=1;normals[i*4+3]=.55;}const ref=G.referenceGTAO(depthRanges,normals,width,height,cfg),err=maxError(vis,ref.visibility);check(err<.025,'GPU GTAO agrees with deterministic reference',{maxError:err});
    await gtao.update({width,height,depthRangeView:hierarchy.levelView(0),normalView:normalTex.createView(),depthHierarchy:hierarchy},{...cfg,debugMode:'occlusion'});const dbg=await gtao.readbackDebug();let dbgErr=0;for(let i=0;i<count;i++)dbgErr=Math.max(dbgErr,Math.abs(dbg[i]-(1-(await gtao.readback())[i])));check(dbgErr<.0005,'occlusion debug view is exact inverse visibility',{debugError:dbgErr});
    await gtao.update({width,height,depthRangeView:hierarchy.levelView(0),normalView:normalTex.createView(),depthHierarchy:hierarchy},{enabled:false});const neutral=await gtao.readback();check(Array.from(neutral).every(v=>Math.abs(v-1)<1e-6),'disabled GTAO restores neutral visibility');
    await gtao.update({width,height,depthRangeView:hierarchy.levelView(0),normalView:normalTex.createView(),depthHierarchy:hierarchy},cfg);
    const makeR32=(value)=>{const tex=device.createTexture({size:{width,height,depthOrArrayLayers:1},format:'r32float',usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST}),bpr=Math.ceil(width*4/256)*256,data=new Float32Array((bpr/4)*height);for(let y=0;y<height;y++)data.fill(value,y*(bpr/4),y*(bpr/4)+width);device.queue.writeTexture({texture:tex},data,{bytesPerRow:bpr,rowsPerImage:height},{width,height,depthOrArrayLayers:1});return tex;};
    const material=device.createTexture({size:{width,height,depthOrArrayLayers:1},format:'rgba32float',usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST}),mbpr=Math.ceil(width*16/256)*256,mdata=new Float32Array((mbpr/4)*height);for(let y=0;y<height;y++)for(let x=0;x<width;x++){const o=y*(mbpr/4)+x*4;mdata[o+2]=.82;}device.queue.writeTexture({texture:material},mdata,{bytesPerRow:mbpr,rowsPerImage:height},{width,height,depthOrArrayLayers:1});const one=makeR32(1),zero=makeR32(0),composer=new V.WebGPUVisibilityComposition({device,width,height});const opts=G.recommendedVisibilityOptions({debugMode:'gtao'});await composer.update({width,height,dsoMaskView:zero.createView(),selfVisibilityView:one.createView(),contactVisibilityView:one.createView(),darkBloomView:zero.createView(),materialView:material.createView(),gtaoVisibilityView:gtao.bindings().gtaoVisibility},opts);const composed=await composer.readback(),ambient=new Float32Array(count);for(let i=0;i<count;i++)ambient[i]=composed[i*4+2];check(mean(ambient)<1&&mean(ambient)>.7,'SM-307 consumes GTAO without multiplicative blackening',{ambientMean:mean(ambient),materialAOStrength:opts.materialAOStrength});check(gtao.bindings().materialAORecommendation.materialAOStrength<=.5,'GTAO binding exposes reduced material-AO recommendation');
    let staleRejected=false;hierarchy.invalidate('sm600-test-stale');try{await gtao.update({width,height,depthRangeView:hierarchy.levelView(0),normalView:normalTex.createView(),depthHierarchy:hierarchy},cfg);}catch(e){staleRejected=/invalid|stale/i.test(String(e));}check(staleRejected,'stale canonical depth hierarchy is rejected');
    result.gpu={...result.gpu,realWebGPU:true,maxReferenceError:err,debugError:dbgErr,visibilityMetrics:metrics,ambientMean:mean(ambient),halfResolution:[Math.ceil(width/2),Math.ceil(height/2)],fullResolution:[width,height]};result.diagnostics=gtao.diagnostics();result.captures.push({label:'dense-machinery',metrics},{label:'disabled',mean:mean(neutral)},{label:'sm307-integration',ambientMean:mean(ambient)});
    const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),img=ctx.createImageData(256,160);for(let yy=0;yy<160;yy++)for(let xx=0;xx<256;xx++){const sx=Math.floor(xx/4),sy=Math.floor(yy/4),v=Math.max(0,Math.min(1,vis[sy*width+sx])),j=(yy*256+xx)*4,c=Math.round(v*255);img.data[j]=c;img.data[j+1]=c;img.data[j+2]=c;img.data[j+3]=255;}ctx.putImageData(img,0,36);ctx.fillStyle='#dfe7ef';ctx.font='16px monospace';ctx.fillText('GTAO VISIBILITY',8,24);ctx.fillText(`min=${metrics.min.toFixed(3)} mean=${metrics.mean.toFixed(3)} refErr=${err.toFixed(4)}`,8,224);ctx.fillText('half-res horizon search → depth/normal-aware full-res reconstruction',8,252);ctx.fillText('white=visible · darker=world/inter-surface occlusion',8,278);
    result.ok=true;gtao.close();composer.close();hierarchy.close();one.destroy();zero.destroy();material.destroy();depthTex.destroy();objectTex.destroy();normalTex.destroy();
  }catch(error){result.error=String(error?.stack||error);}
  document.getElementById('webgpuGtaoResult').textContent=JSON.stringify(result);document.body.dataset.webgpuGtaoDone='1';
})();
</script>
