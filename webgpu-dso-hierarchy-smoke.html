<!doctype html>
<meta charset="utf-8">
<title>Steel Moth SM-304 WebGPU DSO hierarchy smoke</title>

const result={schema:'steelmoth-webgpu-dso-hierarchy-browser-smoke/v1',ok:false,checks:[],captures:[],structural:null,diagnostics:null,readback:null,timing:{timestampQueryAvailable:false,gpuTimingClaimed:false},error:null};const check=(ok,label)=>{result.checks.push({ok:!!ok,label});if(!ok)throw new Error(label)};const publish=()=>{document.getElementById('webgpuDSOHierarchyResult').textContent=JSON.stringify(result);document.body.dataset.webgpuDsoHierarchyDone='1'};
try{
  if(!navigator.gpu)throw new Error('navigator.gpu unavailable');const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw new Error('requestAdapter returned null');result.timing.timestampQueryAvailable=adapter.features?.has?.('timestamp-query')||false;const device=await adapter.requestDevice();
  await import('./engine/webgpu_resources.js?v=sm103-1');await import('./engine/webgpu_gbuffer.js?v=sm200-1');await import('./engine/webgpu_occluders.js?v=sm300-1');await import('./engine/webgpu_clusters.js?v=sm301-1');await import('./engine/webgpu_lighting.js?v=sm204-1');await import('./engine/webgpu_dominance.js?v=sm302-1');await import('./engine/webgpu_dso.js?v=sm303-1');await import('./engine/webgpu_dso_hierarchy.js?v=sm304-1');
  const H=globalThis.SteelMothWebGPUDSO,S=globalThis.SteelMothWebGPUDSOHierarchy;check(!!S?.WebGPUDSOHierarchy,'SM-304 hierarchy API available');check(S.JOB_STRIDE===112&&S.MEMBER_STRIDE===80&&S.TILE_STRIDE===16,'SM-304 hierarchy ABI pinned');
  const hard=(()=>{const width=160,height=96,tileSize=32,columns=Math.ceil(width/tileSize),rows=Math.ceil(height/tileSize),count=columns*rows,ownerBounds=[20,36,44,60],shadowDir=[1,0],ownerThrow=80,members=[{objectId:2,flags:0,throwLength:20,strength:1,bounds:[20,8,26,14]},{objectId:3,flags:0,throwLength:24,strength:1,bounds:[20,18,26,24]},{objectId:4,flags:0,throwLength:50,strength:1,bounds:[20,68,30,78]}],tileHeaders=new Uint32Array(count*2);for(let i=0;i<count;i++){tileHeaders[i*2]=0;tileHeaders[i*2+1]=1}return{schema:H.SNAPSHOT_SCHEMA,roomId:'sm304-browser',lightId:'player-light',grid:{width,height,tileSize,columns,rows,count},jobs:[{clusterId:1,ownerObjectId:1,lightId:'player-light',lightIdHash:123,memberOffset:0,memberCount:members.length,flags:1,ownerBounds,shadowDir,ownerThrow,ownerScore:1,sweptBounds:[20,8,124,78],clusterBounds:[20,8,44,78]}],members,tileHeaders,tileRefs:Uint32Array.of(0),diagnostics:{distanceSimplification:false,darkBloom:false,temporalAccumulation:false}}})();
  const plan=S.buildHierarchyPlan(hard),metrics=S.contourMetrics(plan),near=S.rasterizeHierarchyReference(plan,{forceLevel:'near'}),mid=S.rasterizeHierarchyReference(plan,{forceLevel:'mid'}),far=S.rasterizeHierarchyReference(plan,{forceLevel:'far'}),original=H.rasterizeDSOReference(hard);check(H.connectedMetrics(near,160,96).maskHash===H.connectedMetrics(original,160,96).maskHash,'near hierarchy preserves SM-303 hard detail exactly');check(metrics.near.disconnectedIslandCount>metrics.mid.disconnectedIslandCount&&metrics.mid.disconnectedIslandCount>metrics.far.disconnectedIslandCount,'near/mid/far island complexity decreases monotonically');check(metrics.near.totalSmallIslandArea>metrics.mid.totalSmallIslandArea&&metrics.mid.totalSmallIslandArea>metrics.far.totalSmallIslandArea,'near/mid/far small-island area decreases monotonically');check(metrics.near.silhouetteEdgeLength>metrics.mid.silhouetteEdgeLength&&metrics.mid.silhouetteEdgeLength>metrics.far.silhouetteEdgeLength,'near/mid/far edge complexity decreases monotonically');check(plan.diagnostics.activeTileCount<plan.diagnostics.totalTileCount&&plan.diagnostics.expensiveTileSkipRatio>0,'empty tiles are excluded from expensive DSO traversal');check(plan.diagnostics.distanceSimplification&&plan.diagnostics.projectedThrowSelection,'projected-throw hierarchy contract is active');check(!plan.diagnostics.darkBloom&&!plan.diagnostics.temporalAccumulation,'SM-305/306 remain outside SM-304');
  const canvas=document.getElementById('dsoHierarchyDebug'),ctx=canvas.getContext('2d'),draw=(mask,index)=>{const img=ctx.createImageData(160,96);for(let i=0;i<mask.length;i++){const v=mask[i]?235:18,o=i*4;img.data[o]=v;img.data[o+1]=v;img.data[o+2]=v;img.data[o+3]=255}ctx.putImageData(img,(index%4)*160,Math.floor(index/4)*96)};draw(near,0);draw(mid,1);draw(far,2);draw(S.rasterizeHierarchyReference(plan),3);
  const path=new S.WebGPUDSOHierarchy({device,width:160,height:96,maxJobs:64,maxMembers:128,maxTileRefs:1024});for(const quality of ['Low','Medium','High','Ultra']){const p=S.buildHierarchyPlan(hard,{quality}),ref=S.rasterizeHierarchyReference(p);await path.update(hard,{quality});const gpu=await path.readbackMask();let mismatch=0;for(let i=0;i<ref.length;i++)if((gpu[i]>.5)!==!!ref[i])mismatch++;check(mismatch===0,`${quality} GPU hierarchy mask matches CPU reference`);const d=path.diagnostics();check(d.snapshot?.quality===quality,`${quality} quality control reaches production path`);check(d.snapshot?.activeTileCount<d.snapshot?.totalTileCount,`${quality} production path culls unaffected tiles`);result.captures.push({quality,signature:p.signature,mismatchPixels:mismatch,activeTiles:p.diagnostics.activeTileCount,totalTiles:p.diagnostics.totalTileCount,skipRatio:p.diagnostics.expensiveTileSkipRatio,nearEnd:p.jobs[0].nearEnd,midEnd:p.jobs[0].midEnd,farSnap:p.jobs[0].farSnap})}
  const first=path.diagnostics();check(first.lastDispatchTileCount<first.snapshot.totalTileCount,'settled update dispatches only current/previous affected tiles after initial clear');const empty={...hard,jobs:[],members:[],tileHeaders:new Uint32Array(hard.grid.count*2),tileRefs:Uint32Array.of(0)};await path.update(empty,{quality:'Medium'});const cleared=await path.readbackMask();check(cleared.every(v=>v===0),'tiles affected in the previous frame are explicitly cleared when DSO work disappears');const clearedDiag=path.diagnostics();check(clearedDiag.lastStaleClearTileCount>0,'stale-tile clear count is diagnosed');await path.update(hard,{quality:'Medium'});const gpu=await path.readbackMask(),ref=S.rasterizeHierarchyReference(S.buildHierarchyPlan(hard,{quality:'Medium'}));let mismatch=0;for(let i=0;i<ref.length;i++)if((gpu[i]>.5)!==!!ref[i])mismatch++;check(mismatch===0,'hierarchy rebuild after empty frame restores exact current mask');const overlay=path.debugOverlay(metrics);check(overlay.contract.includes('projected throw')&&overlay.activeTiles.length===plan.activeTiles.length,'hierarchy debug overlay exposes tiers and active tiles');path.invalidate('editor-change');let stale=false;try{path.bindings()}catch(_e){stale=true}check(stale,'editor invalidation rejects stale SM-304 bindings');await path.update(hard,{quality:'Medium'});const diag=path.diagnostics();check(diag.valid&&diag.roomId==='sm304-browser','SM-304 rebuild restores valid current-room resources');check(diag.scopeBoundary.includes('no Dark Bloom')&&diag.scopeBoundary.includes('temporal'),'scope boundary remains explicit');result.structural=metrics;result.diagnostics=diag;result.readback={format:'r32float',pixelCount:160*96,gpuCpuExact:true,staleClearVerified:true};result.ok=true;path.close();
}catch(error){result.error=String(error?.stack||error)}finally{publish()}
</script>
