<!doctype html>
<meta charset="utf-8">
<title>Steel Moth WebGPU Material-v2 G-buffer validation</title>
<canvas id="probe" width="8" height="8" style="width:8px;height:8px"></canvas>
<pre id="status">Running SM-200 WebGPU G-buffer validation…</pre>
<script id="webgpuGBufferResult" type="application/json">{"schema":"steelmoth-webgpu-gbuffer-browser-smoke/v1","ok":false,"status":"pending"}</script>
<script src="engine/webgpu_device.js?v=sm102-1"></script>
<script src="engine/webgpu_resources.js?v=sm103-1"></script>
<script src="engine/webgpu_gbuffer.js?v=sm200-1"></script>
<script>
(async()=>{
  const Device=globalThis.SteelMothWebGPUDevice,G=globalThis.SteelMothWebGPUGBuffer;
  const result={schema:'steelmoth-webgpu-gbuffer-browser-smoke/v1',ok:false,browser:navigator.userAgent,secureContext:isSecureContext,fixtures:{},checks:[],diagnostics:null};
  const publish=()=>{const json=JSON.stringify(result);document.getElementById('status').textContent=json;document.getElementById('webgpuGBufferResult').textContent=json;document.body.dataset.webgpuGBufferDone='1'};
  const check=(condition,message,detail=null)=>{if(!condition)throw new Error(message+(detail?`: ${JSON.stringify(detail)}`:''));result.checks.push(message)};
  const near=(a,b,e=.025)=>Math.abs(Number(a)-Number(b))<=e;
  const near4=(a,b,e=.025)=>a.length===4&&b.length===4&&a.every((v,i)=>near(v,b[i],e));
  const pixelNorm=p=>p.map(v=>v/255);
  const expectedNormal=p=>{let x=p[0]/255*2-1,y=p[1]/255*2-1,z=p[2]/255*2-1;const d=Math.hypot(x,y,z)||1;x/=d;y/=d;z/=d;return [x*.5+.5,y*.5+.5,z*.5+.5,p[3]/255]};
  const imageBitmap=async url=>{const blob=await (await fetch(url,{cache:'no-store'})).blob();try{return await createImageBitmap(blob,{colorSpaceConversion:'none',premultiplyAlpha:'none'})}catch(_e){return await createImageBitmap(blob)}};
  const cropData=(img,r)=>{const c=document.createElement('canvas');c.width=r[2];c.height=r[3];const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingEnabled=false;x.clearRect(0,0,c.width,c.height);x.drawImage(img,r[0],r[1],r[2],r[3],0,0,r[2],r[3]);return x.getImageData(0,0,r[2],r[3]).data};
  const at=(data,w,x,y)=>Array.from(data.slice((y*w+x)*4,(y*w+x)*4+4));
  const findOpaque=(data,w,h,score)=>{let best=null,bestScore=-Infinity;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const p=at(data,w,x,y);if(p[3]<220)continue;const s=score?score(p,x,y):-(Math.abs(x-(w-1)/2)+Math.abs(y-(h-1)/2));if(s>bestScore){bestScore=s;best={x,y,p}}}if(!best)throw new Error('no opaque fixture pixel found');return best};
  const findTransparent=(data,w,h)=>{for(let y=0;y<h;y++)for(let x=0;x<w;x++){const p=at(data,w,x,y);if(p[3]<8)return{x,y,p}}return null};
  const fixtureInstance=(atlas,name,local,category='dynamic',id=`fixture:${name}`)=>{const r=G.regionRect(atlas,name);return{id,objectId:G.objectIdForStableId(id),category,sequence:0,spriteId:name,x:8+r.w/2,y:8+r.h/2,w:r.w,h:r.h,rotation:0,flip:false,uv:[r.u0,r.v0,r.u1,r.v1],tint:[1,1,1],alpha:1,heightScale:1,heightBias:0,local};};
  const syntheticAtlases=()=>{const mk=(pixels)=>{const c=document.createElement('canvas');c.width=4;c.height=1;const x=c.getContext('2d');const d=x.createImageData(4,1);d.data.set(pixels.flat());x.putImageData(d,0,0);return c};return{meta:{source_size:[4,1],regions:{flat:[0,0,1,1],neighbor:[1,0,1,1],transparent:[2,0,1,1]}},albedo:mk([[96,112,128,255],[8,240,12,255],[250,1,250,0],[255,255,255,255]]),normalRoughness:mk([[128,128,255,220],[255,128,128,32],[128,128,255,220],[0,255,128,128]]),heightMaterial:mk([[0,255,0,0],[255,16,255,64],[0,255,0,0],[128,64,32,255]])};};
  let manager=null,gb=null,images=[];
  try{
    check(!!navigator.gpu,'navigator.gpu available for required SM-200 readback run');
    manager=new Device.WebGPUDeviceManager({navigatorRef:navigator});await manager.initialize({canvas:document.getElementById('probe'),width:8,height:8,dpr:1});
    check(!!manager.device,'WebGPU device initialized');
    const atlas=await (await fetch('assets/generated/atlas.json',{cache:'no-store'})).json();
    const [albedo,nr,hm]=await Promise.all([imageBitmap(atlas.image),imageBitmap('assets/generated/sprite_material_normal_roughness.png'),imageBitmap('assets/generated/sprite_material_height_material.png')]);images=[albedo,nr,hm];
    check(albedo.width===nr.width&&nr.width===hm.width&&albedo.height===nr.height&&nr.height===hm.height,'Material-v2 atlases are coordinate-identical');
    gb=new G.WebGPUMaterialGBuffer({device:manager.device,queue:manager.device.queue,width:64,height:64,maxInstances:128,labelPrefix:'SM200'});await gb.setAtlases({albedo,normalRoughness:nr,heightMaterial:hm,meta:atlas});
    check(gb.diagnostics().formats.g1==='rgba16float'&&gb.diagnostics().formats.objectId==='r32uint','production G-buffer formats created');

    const verifySourcePixel=async(name,selector,label)=>{const r=atlas.regions[name];check(Array.isArray(r),`${label} atlas region exists`);const ad=cropData(albedo,r),nd=cropData(nr,r),hd=cropData(hm,r),point=selector(ad,nd,hd,r[2],r[3]);gb.resize(r[2]+16,r[3]+16);const inst=fixtureInstance(atlas,name,point);await gb.renderInstances([inst]);const got=await gb.readPixel(8+point.x,8+point.y),ap=at(ad,r[2],point.x,point.y),np=at(nd,r[2],point.x,point.y),hp=at(hd,r[2],point.x,point.y);check(Math.abs(got.g0[3]-ap[3])<=1,`${label} coverage readback matches albedo alpha`,{got:got.g0,source:ap});check(near4(got.g1,expectedNormal(np),.035),`${label} normal/roughness readback matches source semantics`,{got:got.g1,source:np});check(near4(got.g2,[hp[0]/255,hp[2]/255,hp[1]/255,hp[3]/255],.025),`${label} height/metal/AO/emissive readback matches reordered Material-v2 source`,{got:got.g2,source:hp});check(got.objectId===inst.objectId,`${label} stable object ID readback matches instance ID`);return{point,readback:got,source:{albedo:ap,normalRoughness:np,heightMaterial:hp},instanceId:inst.objectId,region:r};};

    result.fixtures.box=await verifySourcePixel('cargo_crate',(a,n,h,w,hh)=>findOpaque(a,w,hh,(p,x,y)=>at(h,w,x,y)[0]-Math.hypot(x-w*.5,y-hh*.5)*.01),'box/crate');
    result.fixtures.barrel=await verifySourcePixel('rust_barrel',(a,n,h,w,hh)=>findOpaque(a,w,hh,(p,x,y)=>Math.abs(at(n,w,x,y)[0]-128)-Math.abs(y-hh*.5)*.01),'barrel/cylinder');
    const mixedNames=['dumpster','server_cabinet','pipe_cluster','cargo_crate','rust_barrel'];let mixedBest=null;
    for(const name of mixedNames){const r=atlas.regions[name];if(!r)continue;const ad=cropData(albedo,r),hd=cropData(hm,r),p=findOpaque(ad,r[2],r[3],(_q,x,y)=>Math.abs(at(hd,r[2],x,y)[2]-128));const metal=at(hd,r[2],p.x,p.y)[2];if(!mixedBest||Math.abs(metal-128)>mixedBest.score)mixedBest={name,p,metal,score:Math.abs(metal-128)}}
    check(!!mixedBest,'mixed-material representative region found');result.fixtures.mixed=await verifySourcePixel(mixedBest.name,(a,n,h,w,hh)=>findOpaque(a,w,hh,(_p,x,y)=>Math.abs(at(h,w,x,y)[2]-128)),'mixed-material');

    const syn=syntheticAtlases();await gb.setAtlases({albedo:syn.albedo,normalRoughness:syn.normalRoughness,heightMaterial:syn.heightMaterial,meta:syn.meta});gb.resize(48,32);const rr=G.regionRect(syn.meta,'flat'),flat={id:'flat-control',objectId:G.objectIdForStableId('flat-control'),category:'dynamic',sequence:0,spriteId:'flat',x:24,y:16,w:32,h:16,rotation:0,flip:false,uv:[rr.u0,rr.v0,rr.u1,rr.v1],tint:[1,1,1],alpha:1,heightScale:1,heightBias:0};await gb.renderInstances([flat]);const flatRead=await gb.readPixel(24,16);check(near4(flatRead.g1,expectedNormal([128,128,255,220]),.025),'flat plate has near-flat normal and source roughness',flatRead.g1);check(near4(flatRead.g2,[0,0,1,0],.01),'flat plate has zero local height, zero metalness, full material AO and zero emissive',flatRead.g2);result.fixtures.flat={readback:flatRead};

    const parity=[];for(const category of ['static','dynamic','foreground']){const x={...flat,id:'parity-control',objectId:G.objectIdForStableId('parity-control'),category};await gb.renderInstances([x]);parity.push(await gb.readPixel(24,16))}check(parity.slice(1).every(p=>near4(p.g0,parity[0].g0,0)&&near4(p.g1,parity[0].g1,.001)&&near4(p.g2,parity[0].g2,.001)&&p.objectId===parity[0].objectId),'static/dynamic/foreground material values are identical for the same instance');result.fixtures.categoryParity=parity;

    const tr=G.regionRect(syn.meta,'transparent'),transparent={...flat,id:'transparent-control',objectId:G.objectIdForStableId('transparent-control'),uv:[tr.u0,tr.v0,tr.u1,tr.v1]};await gb.renderInstances([transparent]);const cut=await gb.readPixel(24,16);check(cut.g0.every(v=>v===0)&&near4(cut.g1,[.5,.5,1,1],.001)&&near4(cut.g2,[0,0,1,0],.001)&&cut.objectId===0,'alpha cutout preserves deterministic clear values and object ID zero');result.fixtures.alphaCutout=cut;

    await gb.renderInstances([flat]);await gb.renderInstances([]);const deleted=await gb.readPixel(24,16);check(deleted.g0.every(v=>v===0)&&near4(deleted.g1,[.5,.5,1,1],.001)&&near4(deleted.g2,[0,0,1,0],.001)&&deleted.objectId===0,'object deletion/empty frame returns all G-buffer attachments to defaults');result.fixtures.deletion=deleted;

    const leftEdge=await (async()=>{await gb.renderInstances([flat]);return Promise.all([gb.readPixel(8,16),gb.readPixel(39,16)])})();for(const p of leftEdge){check(Math.abs(p.g0[0]-96)<=1&&Math.abs(p.g0[1]-112)<=1&&Math.abs(p.g0[2]-128)<=1,'nearest region-safe sampling does not leak adjacent atlas texels',p.g0)}result.fixtures.atlasBoundary=leftEdge;

    const debugTarget=manager.device.createTexture({size:{width:48,height:32,depthOrArrayLayers:1},format:'rgba8unorm',usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.COPY_SRC});for(const mode of G.DEBUG_MODES)await gb.renderDebug(debugTarget,mode,'rgba8unorm');debugTarget.destroy();check(true,'all production G-buffer debug views compile and execute');

    result.diagnostics=gb.diagnostics();check(result.diagnostics.depthAttachmentPolicy.includes('writes disabled'),'SM-200 depth attachment is explicit but does not invent SM-201/202 ownership depth');result.ok=true;
  }catch(error){result.error=String(error?.stack||error);try{result.diagnostics=gb?.diagnostics?.()||null}catch(_e){}}
  finally{try{gb?.close()}catch(_e){}try{manager?.close()}catch(_e){}for(const img of images)try{img.close?.()}catch(_e){}}
  publish();
})();
</script>
