<!doctype html>
<meta charset="utf-8">
<title>Steel Moth WebGPU Material-v2 G-buffer validation</title>
<canvas id="probe" width="8" height="8" style="width:8px;height:8px"></canvas>
<pre id="status">Running SM-200 WebGPU G-buffer validation…</pre>
<script id="webgpuGBufferResult" type="application/json">{"schema":"steelmoth-webgpu-gbuffer-browser-smoke/v1","ok":false,"status":"pending"}</script>
<script src="engine/webgpu_device.js?v=sm102-1"></script>
<script src="engine/webgpu_resources.js?v=sm103-1"></script>
<script src="engine/webgpu_gbuffer.js?v=sm200-1"></script>
<script>
(async()=>{
  const Device=globalThis.SteelMothWebGPUDevice,G=globalThis.SteelMothWebGPUGBuffer;
  const isFirefox=/Firefox\//.test(navigator.userAgent);
  const result={schema:'steelmoth-webgpu-gbuffer-browser-smoke/v1',ok:false,browser:navigator.userAgent,secureContext:isSecureContext,fixtures:{},checks:[],diagnostics:null,atlasSourceType:isFirefox?'HTMLImageElement':'ImageBitmap'};
  const publish=()=>{const json=JSON.stringify(result);document.getElementById('status').textContent=json;document.getElementById('webgpuGBufferResult').textContent=json;document.body.dataset.webgpuGBufferDone='1'};
  const check=(condition,message,detail=null)=>{if(!condition)throw new Error(message+(detail?`: ${JSON.stringify(detail)}`:''));result.checks.push(message)};
  const near=(a,b,e=.025)=>Math.abs(Number(a)-Number(b))<=e;
  const near4=(a,b,e=.025)=>a.length===4&&b.length===4&&a.every((v,i)=>near(v,b[i],e));
  const expectedNormal=p=>{let x=p[0]/255*2-1,y=p[1]/255*2-1,z=p[2]/255*2-1;const d=Math.hypot(x,y,z)||1;x/=d;y/=d;z/=d;return[x*.5+.5,y*.5+.5,z*.5+.5,p[3]/255]};
  const linearByte=v=>Math.round(G.srgbChannelToLinear(v/255)*255);
  const linearRgb=p=>p.slice(0,3).map(linearByte);
  const imageSource=async url=>{const blob=await (await fetch(url,{cache:'no-store'})).blob();if(isFirefox){const objectUrl=URL.createObjectURL(blob),img=new Image();img.src=objectUrl;await img.decode();img.close=()=>URL.revokeObjectURL(objectUrl);return img}try{return await createImageBitmap(blob,{colorSpaceConversion:'none',premultiplyAlpha:'none'})}catch(_e){return await createImageBitmap(blob)}};
  const fixtureInstance=(atlas,name,local,category='dynamic',id=`fixture:${name}`)=>{const r=G.regionRect(atlas,name);return{id,objectId:G.objectIdForStableId(id),category,sequence:0,rootY:8+r.h,spriteId:name,x:8+r.w/2,y:8+r.h/2,w:r.w,h:r.h,rotation:0,flip:false,uv:[r.u0,r.v0,r.u1,r.v1],tint:[1,1,1],alpha:1,heightFactor:1,tintStrength:.07,materialMode:'normal',materialModeValue:G.MATERIAL_MODE.normal,local};};
  const syntheticAtlases=()=>{const mk=(pixels)=>{const c=document.createElement('canvas');c.width=4;c.height=1;const x=c.getContext('2d');const d=x.createImageData(4,1);d.data.set(pixels.flat());x.putImageData(d,0,0);return c};return{meta:{source_size:[4,1],world_scale:1,regions:{flat:[0,0,1,1],neighbor:[1,0,1,1],transparent:[2,0,1,1]}},albedo:mk([[96,112,128,255],[8,240,12,255],[250,1,250,0],[255,255,255,255]]),normalRoughness:mk([[128,128,255,220],[255,128,128,32],[128,128,255,220],[0,255,128,128]]),heightMaterial:mk([[0,255,0,0],[255,16,255,64],[0,255,0,0],[128,64,32,255]])};};
  let manager=null,gb=null,images=[];
  try{
    const raw=JSON.parse(new URLSearchParams(location.search).get('expected')||'{}');
    check(raw?.flat?.name==='floor_plate'&&raw?.box?.name==='cargo_crate'&&raw?.barrel?.name==='rust_barrel'&&!!raw?.mixed?.name,'raw PNG fixture expectations supplied by host-side decoder');
    check(!!navigator.gpu,'navigator.gpu available for required SM-200 readback run');
    manager=new Device.WebGPUDeviceManager({navigatorRef:navigator});await manager.initialize({canvas:document.getElementById('probe'),width:8,height:8,dpr:1});
    check(!!manager.device,'WebGPU device initialized');
    const atlas=await (await fetch('assets/generated/atlas.json',{cache:'no-store'})).json();
    const [albedo,nr,hm]=await Promise.all([imageSource(atlas.image),imageSource(atlas.material_normal_roughness_image||'assets/generated/sprite_material_normal_roughness.png'),imageSource(atlas.material_height_image||'assets/generated/sprite_material_height_material.png')]);images=[albedo,nr,hm];
    check(albedo.width===nr.width&&nr.width===hm.width&&albedo.height===nr.height&&nr.height===hm.height,'Material-v2 atlases are coordinate-identical');
    gb=new G.WebGPUMaterialGBuffer({device:manager.device,queue:manager.device.queue,width:64,height:64,maxInstances:128,labelPrefix:'SM200'});await gb.setAtlases({albedo,normalRoughness:nr,heightMaterial:hm,meta:atlas});
    check(gb.diagnostics().formats.g1==='rgba16float'&&gb.diagnostics().formats.objectId==='r32uint','production G-buffer formats created');
    check(near4(gb.diagnostics().clear.g1,[.5,.5,1,.88],.001)&&gb.diagnostics().alphaCutoff===.12,'WebGPU clear/cutout values match v1.2.3 Material-v2 compatibility semantics');

    const verifySourcePixel=async(expected,label)=>{
      const {name,x,y,albedo:ap,normalRoughness:np,heightMaterial:hp}=expected||{},r=atlas.regions[name];
      check(Array.isArray(r),`${label} atlas region exists`);check(Number.isInteger(x)&&Number.isInteger(y)&&x>=0&&y>=0&&x<r[2]&&y<r[3],`${label} host-selected raw PNG probe is inside the atlas region`);
      const point={x,y};gb.resize(r[2]+16,r[3]+16);const inst=fixtureInstance(atlas,name,point);await gb.renderInstances([inst]);const got=await gb.readPixel(8+x,8+y);
      check(got.g0.slice(0,3).every((v,i)=>Math.abs(v-linearRgb(ap)[i])<=1)&&got.g0[3]===255,`${label} albedo is sRGB-decoded exactly once into linear G0`,{got:got.g0,sourceSrgb:ap,expectedLinear:linearRgb(ap)});
      check(near4(got.g1,expectedNormal(np),.035),`${label} normal/roughness readback matches raw PNG semantics`,{got:got.g1,source:np});
      check(near4(got.g2,[hp[0]/255,hp[2]/255,hp[1]/255,hp[3]/255],.025),`${label} height/metal/AO/emissive readback matches reordered raw Material-v2 bytes`,{got:got.g2,source:hp});
      check(got.objectId===inst.objectId,`${label} stable object ID readback matches instance ID`);
      return{point,readback:got,source:{albedo:ap,normalRoughness:np,heightMaterial:hp},instanceId:inst.objectId,region:r};
    };

    result.fixtures.flat=await verifySourcePixel(raw.flat,'flat plate');
    check(raw.flat.heightMaterial[0]<=8&&result.fixtures.flat.readback.g1[2]>.85,'flat plate retains near-zero local height and predominantly upward normal',{raw:raw.flat.heightMaterial,g1:result.fixtures.flat.readback.g1});
    result.fixtures.box=await verifySourcePixel(raw.box,'box/crate');
    result.fixtures.barrel=await verifySourcePixel(raw.barrel,'barrel/cylinder');
    result.fixtures.mixed=await verifySourcePixel(raw.mixed,'mixed-material');

    // The synthetic atlas is deliberately limited to coverage/order/clear/edge
    // checks. Canvas 2D premultiplies RGB when alpha is zero, while Material-v2
    // HM alpha stores emissive rather than opacity; production HM semantics above
    // therefore use raw PNG expectations and a browser-supported external source.
    const syn=syntheticAtlases();await gb.setAtlases({albedo:syn.albedo,normalRoughness:syn.normalRoughness,heightMaterial:syn.heightMaterial,meta:syn.meta});gb.resize(48,32);const rr=G.regionRect(syn.meta,'flat'),flat={id:'flat-control',objectId:G.objectIdForStableId('flat-control'),category:'dynamic',sequence:0,rootY:16,spriteId:'flat',x:24,y:16,w:32,h:16,rotation:0,flip:false,uv:[rr.u0,rr.v0,rr.u1,rr.v1],tint:[1,1,1],alpha:1,heightFactor:1,tintStrength:.07,materialMode:'normal',materialModeValue:G.MATERIAL_MODE.normal};await gb.renderInstances([flat]);const syntheticFlat=await gb.readPixel(24,16);check(syntheticFlat.g0.slice(0,3).every((v,i)=>Math.abs(v-linearRgb([96,112,128])[i])<=1)&&syntheticFlat.g0[3]===255,'synthetic flat control reaches linear G0 with binary coverage',syntheticFlat.g0);result.fixtures.syntheticFlat={readback:syntheticFlat};

    const parity=[];for(const category of ['static','dynamic','foreground']){const x={...flat,id:'parity-control',objectId:G.objectIdForStableId('parity-control'),category};await gb.renderInstances([x]);parity.push(await gb.readPixel(24,16))}check(parity.slice(1).every(p=>near4(p.g0,parity[0].g0,0)&&near4(p.g1,parity[0].g1,.001)&&near4(p.g2,parity[0].g2,.001)&&p.objectId===parity[0].objectId),'static/dynamic/foreground material values are identical for the same instance');result.fixtures.categoryParity=parity;

    const tr=G.regionRect(syn.meta,'transparent'),transparent={...flat,id:'transparent-control',objectId:G.objectIdForStableId('transparent-control'),uv:[tr.u0,tr.v0,tr.u1,tr.v1]};await gb.renderInstances([transparent]);const cut=await gb.readPixel(24,16);check(cut.g0.every(v=>v===0)&&near4(cut.g1,[.5,.5,1,.88],.001)&&near4(cut.g2,[0,0,1,0],.001)&&cut.objectId===0,'alpha cutout preserves deterministic clear values and object ID zero');result.fixtures.alphaCutout=cut;

    await gb.renderInstances([flat]);await gb.renderInstances([]);const deleted=await gb.readPixel(24,16);check(deleted.g0.every(v=>v===0)&&near4(deleted.g1,[.5,.5,1,.88],.001)&&near4(deleted.g2,[0,0,1,0],.001)&&deleted.objectId===0,'object deletion/empty frame returns all readable G-buffer attachments to defaults');result.fixtures.deletion=deleted;

    const edge=await(async()=>{await gb.renderInstances([flat]);return Promise.all([gb.readPixel(8,16),gb.readPixel(39,16)])})();for(const p of edge){const e=linearRgb([96,112,128]);check(Math.abs(p.g0[0]-e[0])<=1&&Math.abs(p.g0[1]-e[1])<=1&&Math.abs(p.g0[2]-e[2])<=1,'nearest region-safe sampling does not leak adjacent atlas texels',p.g0)}result.fixtures.atlasBoundary=edge;

    const debugTarget=manager.device.createTexture({size:{width:48,height:32,depthOrArrayLayers:1},format:'rgba8unorm',usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.COPY_SRC});for(const mode of G.DEBUG_MODES)await gb.renderDebug(debugTarget,mode,'rgba8unorm');debugTarget.destroy();check(true,'all production G-buffer debug views compile and execute');

    result.diagnostics=gb.diagnostics();check(result.diagnostics.atlas.formats.albedo==='rgba8unorm-srgb'&&result.diagnostics.colourSpace.g0.includes('linear'),'albedo source is sampled through the sRGB view and G0 is explicitly linear');check(result.diagnostics.depthAttachmentPolicy.includes('writes disabled'),'SM-200 depth attachment is explicit but does not invent SM-201/202 ownership depth');check(result.diagnostics.materialCompatibility.normalTintStrength===.07,'compatibility tint semantics recorded in diagnostics');result.ok=true;
  }catch(error){result.error=String(error?.message||error?.stack||error);try{result.diagnostics=gb?.diagnostics?.()||null}catch(_e){}}
  finally{try{gb?.close()}catch(_e){}try{manager?.close()}catch(_e){}for(const img of images)try{img.close?.()}catch(_e){}}
  publish();
})();
</script>
