<!doctype html>
<meta charset="utf-8">
<title>Steel Moth render-test bootstrap</title>
<pre id="bootstrapStatus">Loading deterministic render-test entrypoint…</pre>
<script>
function injectRenderHarness(source){
  // Preserve the exact production tag, including its current cache identity.
  const gameTags=source.match(/<script\b[^>]*\bsrc\s*=\s*["'](?:\.\/)?engine\/game\.js(?:\?[^"']*)?["'][^>]*>\s*<\/script\s*>/gi)||[];
  if(gameTags.length!==1)throw new Error(`expected exactly one game.js bootstrap tag in index.html; found ${gameTags.length}`);
  const gameTag=gameTags[0];
  const adapterTag='<script src="engine/render_fixture_adapter.js?v=1.2.3"><\/script>\n';
  const harnessTag=adapterTag+'<script src="engine/render_harness.js?v=1.2.3"><\/script>\n'+gameTag;
  return source.replace(gameTag,harnessTag);
}
(async()=>{
  try{
    const response=await fetch('index.html',{cache:'no-store'});
    if(!response.ok)throw new Error(`index.html: HTTP ${response.status}`);
    const source=injectRenderHarness(await response.text());
    document.open();document.write(source);document.close();
  }catch(error){
    document.getElementById('bootstrapStatus').textContent=String(error?.stack||error);
    document.body.dataset.renderTestError='1';
  }
})();
</script>
