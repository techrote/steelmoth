const result={schema:'steelmoth-webgpu-dso-browser-smoke/v1',ok:false,checks:[],captures:[],structural:null,diagnostics:null,readback:null,sweep:[],error:null};const check=(ok,label)=>{result.checks.push({ok:!!ok,label});if(!ok)throw new Error(label)};const publish=()=>{document.getElementById('webgpuDSOResult').textContent=JSON.stringify(result);document.body.dataset.webgpuDsoDone='1'};
try{if(!navigator.gpu)throw new Error('navigator.gpu unavailable');const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw new Error('requestAdapter returned null');const device=await adapter.requestDevice();await import('./engine/webgpu_resources.js?v=sm103-1');await import('./engine/webgpu_gbuffer.js?v=sm200-1');await import('./engine/webgpu_occluders.js?v=sm300-1');await import('./engine/webgpu_clusters.js?v=sm301-1');await import('./engine/webgpu_lighting.js?v=sm204-1');await import('./engine/webgpu_dominance.js?v=sm302-1');await import('./engine/webgpu_dso.js?v=sm303-1');const O=globalThis.SteelMothWebGPUOccluders,C=globalThis.SteelMothWebGPUClusters,D=globalThis.SteelMothWebGPUDominance,H=globalThis.SteelMothWebGPUDSO;check(!!H?.WebGPUDSOHardCore,'SM-303 API available');check(H.JOB_STRIDE===64&&H.MEMBER_STRIDE===32,'DSO job/member ABI pinned');const opts={tileSize:32,maxOccluders:64,maxPerTile:16,maxTileRefs:512};const fixture=(roomId,occluders)=>{const scene={frame:{roomId,logicalSize:[128,96]},occluders},occ=O.buildOccluderSnapshot(scene,opts),clusters=C.buildClusterSnapshot(occ);return{scene,occ,clusters}};const box=fixture('sm303-box',[{id:'box',rect:[46,30,82,68],root:{x:64,y:68},kind:'machine',majorOccluder:true,sections:[{z:24}]}]),bins=fixture('sm303-bins',[{id:'bin:left',rect:[20,20,48,60],root:{x:34,y:60},kind:'machine',source:'bin',sections:[{z:22}]},{id:'bin:middle',rect:[46,30,74,70],root:{x:60,y:70},kind:'machine',source:'bin',sections:[{z:24}]},{id:'bin:right',rect:[72,5,100,45],root:{x:86,y:46},kind:'machine',source:'bin',sections:[{z:20}]}]);check(box.clusters.clusters.length===1,'box fixture is one cluster');check(bins.clusters.clusters.length===1&&bins.clusters.clusters[0].memberCount===3,'three-bin fixture is one stable cluster');const center=b=>[(b[0]+b[2])*.5,(b[1]+b[3])*.5],angles=[0,45,90,135,180,225,270,315],polar=(c,deg,r=120,id='player-light')=>{const a=deg*Math.PI/180;return{id,position:[c[0]+Math.cos(a)*r,c[1]+Math.sin(a)*r,24],radius:500,intensity:1}};const path=new H.WebGPUDSOHardCore({device,width:128,height:96,maxJobs:64,maxMembers:128,maxTileRefs:512}),ctx=document.getElementById('dsoDebug').getContext('2d'),draw=(mask,index)=>{const img=ctx.createImageData(128,96);for(let i=0;i<mask.length;i++){const v=mask[i]?235:18,o=i*4;img.data[o]=v;img.data[o+1]=v;img.data[o+2]=v;img.data[o+3]=255}ctx.putImageData(img,(index%4)*128,Math.floor(index/4)*96)};let captureIndex=0,lastGpu=null;
for(const [name,f] of [['box',box],['bins',bins]]){const c=center(f.clusters.clusters[0].bounds);for(const deg of angles){const light=polar(c,deg),dom=D.buildDominanceSnapshot(f.clusters,f.occ,[light]),plan=H.buildDSOPlan(f.clusters,f.occ,dom,{lightId:light.id}),ref=H.rasterizeDSOReference(plan),metrics=H.connectedMetrics(ref,128,96);await path.update(f.clusters,f.occ,dom,{lightId:light.id});const gpu=await path.readbackMask();lastGpu=gpu;let mismatch=0;for(let i=0;i<ref.length;i++)if((gpu[i]>.5)!==!!ref[i])mismatch++;check(mismatch===0,`${name} ${deg}° GPU hard mask matches CPU structural reference`);check(plan.diagnostics.fullStrengthWedgeCount===plan.jobs.length&&plan.diagnostics.secondaryFullStrengthWedgeCount===0,`${name} ${deg}° has exactly one full wedge per cluster and no full secondary wedge`);check(metrics.totalArea>0,`${name} ${deg}° hard core remains visible`);if(name==='box')check(metrics.disconnectedIslandCount===1,`box ${deg}° remains one coherent silhouette`);const repeat=H.rasterizeDSOReference(H.buildDSOPlan(f.clusters,f.occ,dom,{lightId:light.id}));check(metrics.maskHash===H.connectedMetrics(repeat,128,96).maskHash,`${name} ${deg}° fixed state is deterministic`);draw(ref,captureIndex++);result.captures.push({fixture:name,angle:deg,owner:plan.jobs[0]?.ownerObjectId||0,signature:plan.signature,metrics,mismatchPixels:mismatch})}}
const bc=center(bins.clusters.clusters[0].bounds),up=polar(bc,270,120,'player-light'),upDom=D.buildDominanceSnapshot(bins.clusters,bins.occ,[up]),upPlan=H.buildDSOPlan(bins.clusters,bins.occ,upDom,{lightId:up.id}),upMask=H.rasterizeDSOReference(upPlan),upMetrics=H.connectedMetrics(upMask,128,96),baseline=H.rasterizeIndependentBaseline(upPlan,bins.occ,{clusterSnapshot:bins.clusters,lightPosition:up.position}),baseMetrics=H.connectedMetrics(baseline,128,96);check(baseMetrics.disconnectedIslandCount>upMetrics.disconnectedIslandCount,'cluster DSO reduces disconnected bin macro islands versus independent-object baseline');check(baseMetrics.totalSmallIslandArea>upMetrics.totalSmallIslandArea,'cluster DSO reduces minor disconnected island area');check(baseMetrics.silhouetteEdgeLength>upMetrics.silhouetteEdgeLength,'cluster DSO reduces fractured silhouette edge length');check(upPlan.diagnostics.distanceSimplification===false&&upPlan.diagnostics.darkBloom===false&&upPlan.diagnostics.temporalAccumulation===false,'SM-304/305/306 features remain outside SM-303');result.structural={dso:upMetrics,independentBaseline:baseMetrics,fullStrengthWedges:upPlan.diagnostics.fullStrengthWedgeCount,secondaryFullStrengthWedges:upPlan.diagnostics.secondaryFullStrengthWedgeCount};let history=new Map(),stableOwner=0;for(const deg of [-2,-1,0,1,2]){const light={...polar(bc,deg,600,'player-sweep'),radius:1000},dom=D.buildDominanceSnapshot(bins.clusters,bins.occ,[light],history);check(dom.records.length===1,`moving-light ${deg}° remains relevant to the cluster`);const r=dom.records[0];history=dom.history;if(!stableOwner)stableOwner=r.ownerObjectId;check(r.ownerObjectId===stableOwner,`moving-light ${deg}° retains stable dominant owner`);const p=H.buildDSOPlan(bins.clusters,bins.occ,dom,{lightId:light.id}),a=H.rasterizeDSOReference(p),b=H.rasterizeDSOReference(p);check(H.connectedMetrics(a,128,96).maskHash===H.connectedMetrics(b,128,96).maskHash,`moving-light ${deg}° fixed mask deterministic`);resul
