<!doctype html><html><head><meta charset="utf-8"><title>SM-400 WebGPU water smoke</title><style>body{margin:0;background:#111;color:#ddd;font:12px monospace}canvas{width:768px;height:384px;image-rendering:pixelated}pre{white-space:pre-wrap}</style></head><body><canvas id="view" width="768" height="384"></canvas><pre id="webgpuWaterResult"></pre>
<script src="engine/webgpu_resources.js"></script>
<script src="engine/webgpu_gbuffer.js"></script>
<script src="engine/webgpu_lighting.js"></script>
<script src="engine/webgpu_water.js"></script>
<script>
(async()=>{
 const out={ok:false,checks:[],captures:[],readback:{},timing:{gpuTimingClaimed:false}};const check=(label,ok,data={})=>{out.checks.push({label,ok:!!ok,...data});if(!ok)throw new Error(label+': '+JSON.stringify(data));};const approx=(a,b,e)=>Math.abs(a-b)<=e;const lum=v=>v[0]*.2126+v[1]*.7152+v[2]*.0722;
 try{
  check('navigator.gpu available',!!navigator.gpu);const adapter=await navigator.gpu.requestAdapter();check('adapter acquired',!!adapter);const device=await adapter.requestDevice();check('device acquired',!!device);const W=globalThis.SteelMothWebGPUWater,L=globalThis.SteelMothWebGPULighting;check('water module schema',W?.SCHEMA==='steelmoth-webgpu-water/v1');check('canonical buffer name',L?.LIGHT_BUFFER_NAME==='sm204:lights');
  const width=64,height=32,cx=32,cy=16;const texUsage=GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST;const rgbaTex=(rgb,greenOverride=null)=>{const t=device.createTexture({size:{width,height},format:'rgba8unorm',usage:texUsage});const d=new Uint8Array(width*height*4);for(let i=0;i<width*height;i++){d[i*4]=rgb[0];d[i*4+1]=greenOverride==null?rgb[1]:greenOverride;d[i*4+2]=rgb[2];d[i*4+3]=255;}device.queue.writeTexture({texture:t},d,{bytesPerRow:width*4,rowsPerImage:height},{width,height});return t;};
  const depthTex=(clear)=>{const t=device.createTexture({size:{width,height},format:'depth32float',usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.RENDER_ATTACHMENT});const enc=device.createCommandEncoder(),p=enc.beginRenderPass({colorAttachments:[],depthStencilAttachment:{view:t.createView(),depthClearValue:clear,depthLoadOp:'clear',depthStoreOp:'store'}});p.end();device.queue.submit([enc.finish()]);return t;};
  const field=new Uint8Array(width*height*4);for(let i=0;i<width*height;i++){field[i*4]=255;field[i*4+1]=128;field[i*4+2]=0;field[i*4+3]=255;}
  const pass=new W.WebGPUWaterPass({device,width,height});pass.setField({rgba:field,width,height,roomId:'room-a',revision:'a1'});await pass.initialize();check('WGSL compiled',!(pass.compilation||[]).some(m=>m.type==='error'),{messages:pass.compilation});
  const lightBuffer=device.createBuffer({size:L.MAX_LIGHTS*L.LIGHT_STRIDE,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});const depth=depthTex(.5),vis=rgbaTex([255,255,255],255),scene=rgbaTex([24,32,40]);const source={sceneView:scene.createView(),depthView:depth.createView(),visibilityView:vis.createView(),lightBuffer,lightCount:0,width,height};const settings={waterQuality:3,waterStrength:1.2,waterWaveScale:1.3,waterWaveSpeed:.8,waterNormalStrength:1.45,waterDetailStrength:1.25,waterHighlightStrength:1.55,waterRefractionStrength:1.4,waterDepthReject:.04};
  const angleRows=[];for(let deg=0;deg<360;deg+=45){const a=deg*Math.PI/180,raw={id:'light:test:0',type:'point',group:'point',x:cx+Math.cos(a)*24,y:cy+Math.sin(a)*24,z:18,radius:90,intensity:2,color:[1,.82,.64]},lights=L.buildCanonicalLights({lights:[raw]},{lighting:true,emissive:1,lightRadius:1});device.queue.writeBuffer(lightBuffer,0,L.packLights(lights));source.lightCount=lights.length;await pass.render(source,{roomId:'room-a'},settings,{time:.7});const gpu=await pass.readPixel(cx,cy),cpu=W.shadeWaterReference({mask:1,shoreDistance:128/255,under:[24/255,32/255,40/255],refracted:[24/255,32/255,40/255],currentDepth:.5,refractedDepth:.5,directVisibility:1},lights,settings,[cx,cy],.7,[]),err=Math.max(...gpu.map((v,i)=>Math.abs(v-cpu[i])));check('angle '+deg+' GPU/CPU canonical water parity',err<.012,{deg,gpu,cpu,err});angleRows.push({deg,gpu,cpu,err,luma:lum(gpu)});}
  const spread=Math.max(...angleRows.map(r=>r.luma))-Math.min(...angleRows.map(r=>r.luma));check('eight-angle highlight responds to canonical light direction',spread>.0005,{spread});out.captures.push({label:'eight-angle',rows:angleRows,spread});out.readback.eightAngles=true;
  const black=rgbaTex([0,0,0]),zeroSource={...source,sceneView:black.createView(),lightCount:0};await pass.render(zeroSource,{roomId:'room-a'},settings,{time:.7});const dark=await pass.readPixel(cx,cy);check('dark water is not self-lit',Math.max(...dark.map(Math.abs))<.002,{dark});out.captures.push({label:'dark-scene',pixel:dark});out.readback.darkNoGlow=true;
  const depth37=depthTex(.37),depthSource={...source,depthView:depth37.createView(),lightCount:0};await pass.render(depthSource,{roomId:'room-a'},settings,{time:.7,debug:'depth'});const depthRead=await pass.readPixel(cx,cy);check('canonical depth texture is consumed',approx(depthRead[0],.37,.003),{depthRead});await pass.render(depthSource,{roomId:'room-a'},settings,{time:.7,debug:'refraction'});const refrRead=await pass.readPixel(cx,cy);check('depth-equal refraction remains accepted',refrRead[0]>.99,{refrRead});out.captures.push({label:'depth-refraction',depth:depthRead,refraction:refrRead});out.readback.depthAware=true;
  const dimScene=rgbaTex([8,8,8]),visOne=rgbaTex([255,255,255],255),visZero=rgbaTex([0,0,0],0),raw={id:'light:test:0',type:'point',group:'point',x:cx+20,y:cy,z:18,radius:90,intensity:2.4,color:[1,1,1]},lights=L.buildCanonicalLights({lights:[raw]},{lighting:true,emissive:1,lightRadius:1});device.queue.writeBuffer(lightBuffer,0,L.packLights(lights));const shadowBase={...source,sceneView:dimScene.createView(),lightCount:1};shadowBase.visibilityView=visOne.createView();await pass.render(shadowBase,{roomId:'room-a'},settings,{time:.7});const visible=await pass.readPixel(cx,cy);shadowBase.visibilityView=visZero.createView();await pass.render(shadowBase,{roomId:'room-a'},settings,{time:.7});const shadowed=await pass.readPixel(cx,cy);check('SM-307 direct visibility suppresses water direct response',lum(shadowed)<lum(visible),{visible,shadowed});out.captures.push({label:'shadow-visibility',visible,shadowed});out.readback.shadowVisibility=true;
  const rippleSource={...source,sceneView:dimScene.createView(),visibilityView:visOne.createView(),lightCount:1};await pass.render(rippleSource,{roomId:'room-a'},settings,{time:.7,ripples:[]});const calm=await pass.readPixel(cx,cy);await pass.render(rippleSource,{roomId:'room-a'},settings,{time:.7,ripples:[{x:cx-31,y:cy,normalizedAge:.35,radius:72,amplitude:1.2,foam:.9}]});const rippled=await pass.readPixel(cx,cy);const rippleDelta=Math.max(...rippled.map((v,i)=>Math.abs(v-calm[i])));check('bounded ripple interaction survives WebGPU port',rippleDelta>1e-5,{calm,rippled,rippleDelta});out.captures.push({label:'ripple',calm,rippled,rippleDelta});out.readback.rippleIdentity=true;
  let staleRejected=false;try{await pass.render(source,{roomId:'room-b'},settings,{time:.7});}catch(e){staleRejected=/stale water field rejected/.test(String(e));}check('room transition rejects stale water field',staleRejected);const sceneB=rgbaTex([18,28,78]);pass.setField({rgba:field,width,height,roomId:'room-b',revision:'b1'});const sourceB={...source,sceneView:sceneB.createView(),lightCount:0};await pass.render(sourceB,{roomId:'room-b'},settings,{time:.7});const roomB=await pass.readPixel(cx,cy);pass.setField({rgba:field,width,height,roomId:'room-a',revision:'a2'});const sceneA2=rgbaTex([78,22,18]),sourceA2={...source,sceneView:sceneA2.createView(),lightCount:0};await pass.render(sourceA2,{roomId:'room-a'},settings,{time:.7});const roomA=await pass.readPixel(cx,cy);const roomDelta=Math.max(...roomA.slice(0,3).map((v,i)=>Math.abs(v-roomB[i])));check('resolved scene follows room transition',roomDelta>.02,{roomA,roomB,roomDelta});out.captures.push({label:'room-transition',staleRejected,roomA,roomB,roomDelta});out.readback.roomTransition=true;
  pass.setField({rgba:field,width,height,roomId:'room-a',revision:'a3'});await pass.render(source,{roomId:'room-a'},settings,{time:.7,debug:'mask'});const maskRead=await pass.readPixel(cx,cy);check('water field mask debug is executable',maskRead[0]>.99,{maskRead});const diag=pass.diagnostics();check('diagnostics identify canonical SM-204 light buffer',diag.canonicalLightBuffer==='sm204:lights',diag);check('diagnostics declare resolved scene/depth/shadow inputs',diag.snapshot?.inputs?.resolvedScene&&diag.snapshot?.inputs?.canonicalDepth&&diag.snapshot?.inputs?.shadowVisibility,{snapshot:diag.snapshot});check('diagnostics preserve gameplay authority boundary',/unchanged/.test(diag.snapshot?.gameplayAuthority||''),{snapshot:diag.snapshot});out.captures.push({label:'diagnostics',diag});out.readback.realWebGPU=true;
  const c=document.getElementById('view'),ctx=c.getContext('2d');ctx.fillStyle='#111';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#ddd';ctx.font='18px monospace';ctx.fillText('SM-400 WebGPU water: PASS',24,36);ctx.font='13px monospace';ctx.fillText('8-angle spread '+spread.toFixed(6),24,66);ctx.fillText('dark max '+Math.max(...dark.map(Math.abs)).toFixed(6),24,88);ctx.fillText('room delta '+roomDelta.toFixed(6),24,110);ctx.fillText('ripple delta '+rippleDelta.toFixed(6),24,132);
  out.ok=true;out.diagnostics=diag;out.summary={angleSpread:spread,darkMax:Math.max(...dark.map(Math.abs)),roomDelta,rippleDelta};pass.close();
 }catch(e){out.error=String(e?.stack||e);}
 document.getElementById('webgpuWaterResult').textContent=JSON.stringify(out);document.body.dataset.webgpuWaterDone='1';
})();
</script></body></html>
