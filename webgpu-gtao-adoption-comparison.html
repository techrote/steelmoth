    try{await cleanup('direct-maps',async()=>{const settled=await Promise.allSettled([...pending]);const failed=settled.filter(x=>x.status==='rejected');if(failed.length)throw new Error(failed.map(x=>String(x.reason)).join('; '))});for(let i=0;i<producers.length;i++)await cleanup(`deferred-drain-${i}`,()=>producers[i].flushStats?.());await cleanup('sm500',()=>perf?.close());await cleanup('validation-scope',async()=>{if(validationScopeOpen&&device){validationScopeOpen=false;const error=await device.popErrorScope();if(error){result.ok=false;result.validationErrors.push(String(error.message||error));if(!result.error)result.error=`WebGPU validation: ${error.message||error}`}}});await cleanup('raw',()=>raw?.close());for(let i=0;i<producers.length;i++)await cleanup(`producer-${i}`,()=>producers[i].close());await cleanup('depth',()=>depth?.close());await cleanup('ownership',()=>gb?.close());for(let i=0;i<bitmaps.length;i++)await cleanup(`bitmap-${i}`,()=>bitmaps[i].close());for(let i=0;i<slots.length;i++){await cleanup(`direct-read-${i}`,()=>slots[i].read.destroy());await cleanup(`direct-resolve-${i}`,()=>slots[i].resolve.destroy())}await cleanup('query-set',()=>directQueries?.destroy());await cleanup('manager',()=>manager?.close())}finally{for(const variant of VARIANTS)delete variant.producer;publish()}
  }
})();
